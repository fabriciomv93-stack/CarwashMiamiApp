<style>
:root{--bg:#020910;--panel:#071722;--line:#17384d;--txt:#f4fbff;--muted:#8299aa;--blue:#13bfff;--purple:#bd79ff;--green:#35e493;--bottom:env(safe-area-inset-bottom);--top:env(safe-area-inset-top)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020910;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.app{min-height:100vh;padding-bottom:calc(84px + var(--bottom));background:radial-gradient(circle at 50% -10%,#0b456b55,transparent 36%)}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:30px 20px}.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#071722,#041018)}.loginBox{width:min(100%,420px);padding:25px}.brand{text-align:center;font-size:32px;font-weight:1000}.brand span{color:var(--blue)}.sub{text-align:center;color:var(--muted);margin:4px 0 22px}.label{display:block;margin:11px 0 5px;color:#a9c1d0;font-size:12px;font-weight:800}.input{width:100%;padding:13px;border:1px solid #21475e;border-radius:11px;background:#04111a;color:#fff;outline:none}.primary,.secondary,.danger{width:100%;padding:13px;border-radius:11px;font-weight:900;margin-top:11px}.primary{border:0;background:linear-gradient(#1cc7ff,#0785d1);color:#fff}.secondary{border:1px solid #285169;background:#06141e;color:#d9eaf4}.danger{border:1px solid #6b2a32;background:#19080b;color:#ff7b84}.err{text-align:center;color:#ff7b84;margin-top:10px;font-size:12px}.top{padding:calc(var(--top) + 14px) 16px 10px}.logo{font-size:28px;font-weight:1000}.logo span{color:var(--blue)}.page{padding:8px 14px 24px}.homeCards{display:grid;gap:12px;margin-top:14px}.homeCard{padding:17px;display:grid;grid-template-columns:50px 1fr 22px;gap:12px;align-items:center}.ico{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;font-size:24px}.homeCard b{font-size:14px}.homeCard small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}.clientsCard{border-color:#165879}.clientsCard .ico{background:#073552;color:var(--blue)}.cerCard{border-color:#5a3472}.cerCard .ico{background:#321b48;color:var(--purple)}.dailyCard{border-color:#17633f}.dailyCard .ico{background:#073b29;color:var(--green)}.titlebar{min-height:74px;padding:calc(var(--top) + 15px) 10px 9px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;position:sticky;top:0;z-index:20;background:#020a10f5;border-bottom:1px solid #123146}.titlebar h2{margin:0;text-align:center;font-size:18px}.back,.headBtn{width:44px;height:44px;transform:translateY(4px);border:0;background:transparent;color:#eaf8ff;font-size:29px;display:grid;place-items:center}.headBtn{color:var(--blue);font-size:24px}.search input{width:100%;padding:13px;border-radius:11px;border:1px solid #21475e;background:#06131d;color:#fff;margin:6px 0 12px}.list{display:grid;gap:9px}.person{padding:12px;display:grid;grid-template-columns:46px 1fr 42px;gap:10px;align-items:center}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid #168dc4;background:#06263b;color:#40ceff;font-weight:1000}.meta{font-size:11px;color:var(--muted);margin-top:3px}.wa{width:40px;height:40px;border-radius:50%;border:1px solid #14844f;background:#062318;color:#35e98a;font-size:20px}.fab{position:fixed;right:18px;bottom:calc(92px + var(--bottom));width:55px;height:55px;border:0;border-radius:50%;background:#0aaef3;color:#fff;font-size:30px;z-index:25}.form{padding:15px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.section{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 8px}.vehicle,.ceramic,.record{padding:12px;margin-top:8px}.vehicle{display:grid;grid-template-columns:43px 1fr 35px;gap:10px;align-items:center}.car{width:43px;height:43px;border-radius:11px;background:#102431;display:grid;place-items:center}.plate{color:#42caff;font-size:11px;font-weight:900}.dots{border:0;background:transparent;color:#bfd1dc;font-size:23px}.detail{padding:14px;display:flex;gap:12px;align-items:center}.detail .avatar{width:62px;height:62px}.big{font-size:20px;font-weight:1000}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0}.actions button{padding:11px;border-radius:10px;border:1px solid #254c64;background:#06141e;color:#dbeaf3;font-weight:850}.actions .green{color:#42eb96;border-color:#147b4b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{text-align:center;padding:12px 4px}.stat b{display:block;font-size:20px;color:var(--blue)}.stat:nth-child(2) b{color:var(--green)}.stat:nth-child(3) b{color:var(--purple)}.stat small{font-size:9px;color:var(--muted)}.ceramicTop,.recordTop{display:flex;justify-content:space-between;gap:8px}.due{font-size:11px;font-weight:900;margin-top:6px}.red{color:#ff6370}.amber{color:#ffb62f}.greenT{color:var(--green)}.amount{font-size:17px;color:#40d4ff;font-weight:1000}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{font-size:9px;padding:4px 7px;border:1px solid #28536c;border-radius:999px;color:#b7cedb}.serviceGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.service{position:relative}.service input{position:absolute;opacity:0}.service span{display:block;padding:10px;border:1px solid #23475e;border-radius:9px;text-align:center;font-size:10px;color:#c9dce8}.service input:checked+span{background:#0a689f;border-color:#22c3ff;color:#fff}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(7,1fr);padding:7px 3px calc(10px + var(--bottom));background:#03111bf7;border-top:1px solid #17384d;z-index:30}.nav button{border:0;background:transparent;color:#7e93a2;min-height:58px;font-size:8px;font-weight:800}.ni{display:block;font-size:21px;margin-bottom:4px}.active.home{color:#20bfff}.active.clients{color:#28c6ff}.active.cer{color:#c17cff}.active.daily{color:#35e695}.active.reports{color:#ffcc45}.active.appts{color:#3bd8ff}.active.more{color:#ff8c6b}.toast{position:fixed;left:50%;bottom:calc(95px + var(--bottom));transform:translateX(-50%);background:#07304a;border:1px solid #1b6c98;padding:10px 14px;border-radius:9px;z-index:99;font-size:12px}
</style>

.fieldGuide{border-width:2px!important}.field-name{border-color:var(--name)!important}.field-phone{border-color:var(--phone)!important}.field-service{border-color:var(--service)!important}.field-plate{border-color:var(--plate)!important}.field-brand{border-color:var(--brand)!important}.field-amount{border-color:var(--amount)!important}.field-notes{border-color:#6f8797!important}.guideLabel{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:900;margin:12px 0 5px}.guideIcon{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:#0d1d28;border:1px solid currentColor}.g-name{color:var(--name)}.g-phone{color:var(--phone)}.g-service{color:var(--service)}.g-plate{color:var(--plate)}.g-brand{color:var(--brand)}.g-amount{color:var(--amount)}.g-notes{color:#c7d4dc}.quickHint{font-size:9px;color:#718a99;margin-top:4px}.statusPending{color:#ffbd42!important;border-color:#6d531b!important}.statusPaid{color:#35e695!important;border-color:#1a754d!important}.cerTabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:9px 0 12px}.cerTabs button{padding:10px;border-radius:9px;border:1px solid #294b61;background:#06131d;color:#9eb2be;font-weight:900}.cerTabs button.on{background:#312047;border-color:#965fd1;color:#fff}.matchNotice{padding:10px;border-radius:10px;border:1px solid #1f6e4c;background:#08251a;color:#55e8a2;font-size:10px;margin-top:8px}.warnNotice{padding:10px;border-radius:10px;border:1px solid #785f20;background:#241b07;color:#ffd45c;font-size:10px;margin-top:8px}.paySheet{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.paySheet button{padding:12px 5px;border-radius:9px;border:1px solid #285169;background:#06141e;color:#d9eaf4;font-weight:900}.paySheet .cash{border-color:#19744c;color:#42e59a}.paySheet .cardpay{border-color:#176f88;color:#42d9ff}.paySheet .sinpe{border-color:#68428b;color:#cb91ff}

</head><body><div id="app"></div><div id="toast" class="toast hidden"></div><script>
const KEY='cm_ceramico_clients_v1',DKEY='cm_daily_records_v1',AUTH_KEY='cm_auth_v1',SESSION_KEY='cm_session_v1',CLOSE_KEY='cm_daily_closures_v1',APPT_KEY='cm_appointments_v1',JOURNEY_KEY='cm_active_journey_v1';
let old=JSON.parse(localStorage.getItem(KEY)||'[]');
let clients=old.map(c=>c.vehicles?c:{id:c.id||'c'+Date.now()+Math.random(),name:c.name||'',phone:c.phone||'',notes:c.notes||'',vehicles:c.plate?[{id:'v'+(c.id||Date.now()),brand:'',model:'',plate:c.plate,color:'',ceramic:{serviceDate:c.serviceDate||'',renewalDate:c.renewalDate||'',periodMonths:c.periodMonths??2,periodDays:c.periodDays??15,notes:c.notes||''}}]:[]});
let daily=JSON.parse(localStorage.getItem(DKEY)||'[]').map(r=>({...r,paymentStatus:r.paymentStatus||'paid',paidDate:r.paidDate||''}));
let closures=JSON.parse(localStorage.getItem(CLOSE_KEY)||'[]');
let appointments=JSON.parse(localStorage.getItem(APPT_KEY)||'[]');
let auth=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')||{user:'admin',password:'admin'};
if(!localStorage.getItem(AUTH_KEY))localStorage.setItem(AUTH_KEY,JSON.stringify(auth));
let page=localStorage.getItem(SESSION_KEY)==='1'?'home':'login',sel=null,editC=null,editV=null,cerCId=null,cerVId=null,editDailyId=null,reportTab='pending',pendingDeleteClient=null,returnToCeramic=false,editApptId=null,confirmAction=null,cerTab='active',cerQuery='';
const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(clients));localStorage.setItem(DKEY,JSON.stringify(daily));localStorage.setItem(CLOSE_KEY,JSON.stringify(closures));localStorage.setItem(APPT_KEY,JSON.stringify(appointments));window.Android?.syncData?.(JSON.stringify(clients))}
function backupPayload(){return JSON.stringify({clients,daily,closures,appointments},null,2)}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1600)}
function today(){let d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`} function activeJourney(){let j=localStorage.getItem(JOURNEY_KEY);if(j)return j;let openDates=[...new Set(daily.map(r=>r.date))].filter(d=>!closures.some(c=>c.date===d&&c.closed)).sort();j=openDates.length?openDates[0]:today();localStorage.setItem(JOURNEY_KEY,j);return j}
function startNewJourney(){let d=today();localStorage.setItem(JOURNEY_KEY,d);return d}
function fmt(i){if(!i)return'—';let[y,m,d]=i.split('-');return`${d}/${m}/${y}`} function money(n){return'₡'+Number(n||0).toLocaleString('es-CR')}
function calc(i,m,d){if(!i)return'';let[y,mo,da]=i.split('-').map(Number),x=new Date(y,mo-1,da),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+m);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}

function normPhone(v){return String(v||'').replace(/\D/g,'').replace(/^506(?=\d{8}$)/,'')}
function normPlate(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function findExistingClient(name,phone,plate,excludeId){let np=normPhone(phone),pl=normPlate(plate);return clients.find(c=>{if(c.id===excludeId)return false;if(np&&normPhone(c.phone)===np)return true;if(pl&&c.vehicles.some(v=>normPlate(v.plate)===pl))return true;return false})||null}
function findClientForDaily(name,phone,plate){let np=normPhone(phone),pl=normPlate(plate),nn=String(name||'').trim().toLowerCase();return clients.find(c=>(np&&normPhone(c.phone)===np)||(pl&&c.vehicles.some(v=>normPlate(v.plate)===pl))||(nn&&c.name.trim().toLowerCase()===nn))||null}

function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'CM'}
function nav(a){return`<nav class="nav"><button class="home ${a==='home'?'active':''}" onclick="go('home')"><span class="ni">⌂</span>Inicio</button><button class="clients ${a==='clients'?'active':''}" onclick="go('clients')"><span class="ni">♙</span>Clientes</button><button class="cer ${a==='ceramic'?'active':''}" onclick="go('ceramic')"><span class="ni">♢</span>Cerámicos</button><button class="daily ${a==='daily'?'active':''}" onclick="go('daily')"><span class="ni">▣</span>Diario</button><button class="reports ${a==='reports'?'active':''}" onclick="go('reports')"><span class="ni">▤</span>Reportes</button><button class="appts ${a==='appointments'?'active':''}" onclick="go('appointments')"><span class="ni">◷</span>Citas</button><button class="more ${a==='more'?'active':''}" onclick="go('more')"><span class="ni">•••</span>Más</button></nav>`}
function bar(t,b='home',r=''){return`<div class="titlebar"><button class="back" onclick="go('${b}')">‹</button><h2>${t}</h2><div>${r}</div></div>`}
function go(p){
  page=p;
  if(['home','clients','ceramic','daily','reports','appointments','more'].includes(p)){sel=null;editC=null;editV=null;editDailyId=null;editApptId=null;}
  render();scrollTo(0,0)
}
function render(){({login,home,clients:clientsPage,client:clientPage,clientForm,vehicleForm,ceramic:ceramicPage,ceramicChoice,ceramicForm,daily:dailyPage,dailyForm,reports:reportsPage,appointments:appointmentsPage,appointmentForm,more:morePage,changePass}[page]||home)()}
function login(){$('#app').innerHTML=`<div class="login"><div class="card loginBox"><div class="brand">CARWASH<span>MIAMI</span></div><div class="sub">Acceso privado · Gestión premium</div><label class="label">Usuario</label><input id="u" class="input"><label class="label">Contraseña</label><input id="p" type="password" class="input"><button class="primary" onclick="doLogin()">INGRESAR</button><div id="e" class="err"></div></div></div>`}
function doLogin(){
  let u=$('#u').value.trim().toLowerCase(),p=$('#p').value;
  if(u===String(auth.user||'admin').toLowerCase()&&p===auth.password){
    localStorage.setItem(SESSION_KEY,'1');page='home';render()
  }else $('#e').textContent='Usuario o contraseña incorrectos'
}
function logout(){localStorage.removeItem(SESSION_KEY);page='login';render()}
function home(){
  let cer=clients.reduce((s,c)=>s+c.vehicles.filter(v=>v.ceramic?.renewalDate).length,0),journey=activeJourney(),dr=daily.filter(r=>r.date===journey),todayAppts=(appointments||[]).filter(a=>a&&a.date===today()&&a.status!=='cancelled').sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  let apptsHtml=todayAppts.length?todayAppts.map(a=>`<div class="card" style="padding:12px;margin-top:8px;border-color:#195b70" onclick="go('appointments')"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(a.name||'Cliente')}</b><div style="color:#3bd8ff;font-weight:900">${esc(a.time||'')}</div><div class="meta">${esc([a.plate,a.service].filter(Boolean).join(' · ')||'Cita programada')}</div></div><span class="apptStatus ${a.status||'scheduled'}">${a.status==='done'?'COMPLETADA':'AGENDADA'}</span></div></div>`).join(''):`<div class="card" style="padding:14px;text-align:center;color:#8299aa" onclick="go('appointments')">No hay citas programadas para hoy.</div>`;
  $('#app').innerHTML=`<div class="app"><div class="top"><div class="logo">CARWASH<span>MIAMI</span></div></div><div class="page"><div class="stats"><div class="card stat clientsStat"><b>${clients.length}</b><small>Clientes</small></div><div class="card stat cerStat"><b>${cer}</b><small>Cerámicos</small></div><div class="card stat dailyStat"><b>${dr.length}</b><small>Jornada</small></div></div><div class="homeCards"><div class="card homeCard clientsCard" onclick="go('clients')"><div class="ico">♙</div><div><b>CLIENTES</b><small>Clientes, teléfonos y varios vehículos.</small></div><div>›</div></div><div class="card homeCard cerCard" onclick="go('ceramic')"><div class="ico">♢</div><div><b>ACABADOS CERÁMICOS</b><small>Activos, vencidos y búsqueda rápida.</small></div><div>›</div></div><div class="card homeCard dailyCard" onclick="go('daily')"><div class="ico">▣</div><div><b>CONTROL DIARIO</b><small>Jornada ${fmt(journey)} · ${dr.length} vehículo${dr.length===1?'':'s'}.</small></div><div>›</div></div></div><div class="section"><b>Citas de hoy</b><span class="meta">${todayAppts.length}</span></div>${apptsHtml}</div>${nav('home')}</div>`
}
function personHtml(c){return`<div class="card person" onclick="openClient('${c.id}')"><div class="avatar">${initials(c.name)}</div><div><b>${esc(c.name)}</b><div class="meta">${esc(c.phone||'Sin teléfono')} · ${c.vehicles.length} vehículo${c.vehicles.length===1?'':'s'}</div></div><button class="waPhone" onclick="event.stopPropagation();wa('${c.phone}')">☎</button></div>`}
function clientsPage(){$('#app').innerHTML=`<div class="app">${bar('Clientes')}<div class="page"><div class="search"><input id="q" placeholder="Buscar nombre, placa o teléfono..." oninput="filterClients()"></div><div id="rows" class="list">${clients.map(personHtml).join('')||'<div class="card" style="padding:20px;text-align:center;color:#8299aa">No hay clientes registrados.</div>'}</div></div><button class="fab" onclick="newClient()">＋</button>${nav('clients')}</div>`}
function filterClients(){let q=$('#q').value.toLowerCase();$('#rows').innerHTML=clients.filter(c=>[c.name,c.phone,...c.vehicles.map(v=>v.plate)].join(' ').toLowerCase().includes(q)).map(personHtml).join('')||'<div class="card" style="padding:20px;text-align:center;color:#8299aa">Sin resultados.</div>'}
function openClient(id){sel=id;page='client';render()} function newClient(){editC=null;page='clientForm';render()}
function clientPage(){let c=clients.find(x=>x.id===sel);if(!c)return go('clients');let vs=c.vehicles.map(v=>`<div class="card vehicle"><div class="car">▰</div><div><b>${esc([v.brand,v.model].filter(Boolean).join(' ')||'Vehículo')}</b><div class="plate">${esc(v.plate)}</div><div class="meta">${esc(v.color||'')}</div></div><button class="dots" onclick="editVeh('${v.id}')">⋮</button></div>`).join('');$('#app').innerHTML=`<div class="app">${bar('Detalle del cliente','clients','<button class="headBtn" onclick="editClientNow()">✎</button>')}<div class="page"><div class="card detail"><div class="avatar">${initials(c.name)}</div><div><div class="big">${esc(c.name)}</div><div class="meta">${esc(c.phone||'Sin teléfono')}</div></div></div><div class="actions"><button class="green" onclick="wa('${c.phone}')">WhatsApp</button><button onclick="editClientNow()">Editar</button></div><div class="section"><b>Vehículos</b><span class="meta">${c.vehicles.length}</span></div>${vs||'<div class="card" style="padding:15px;color:#8299aa">Sin vehículos.</div>'}<button class="primary" onclick="newVeh()">＋ AGREGAR VEHÍCULO</button><button class="danger" onclick="deleteClient('${c.id}')">ELIMINAR CLIENTE</button></div>${nav('clients')}</div>`}
function editClientNow(){editC=sel;page='clientForm';render()}
function clientForm(){let c=editC?clients.find(x=>x.id===editC):null;$('#app').innerHTML=`<div class="app">${bar(c?'Editar cliente':'Agregar cliente',c?'client':'clients','<button class="headBtn" onclick="saveClient()">✓</button>')}<div class="page"><div class="card form"><label class="label">Nombre completo</label><input id="fn" class="input" value="${esc(c?.name||'')}"><label class="label">Teléfono / WhatsApp</label><input id="fp" class="input" value="${esc(c?.phone||'')}"><label class="label">Notas</label><textarea id="notes" class="input" rows="3">${esc(c?.notes||'')}</textarea><button class="primary" onclick="saveClient()">GUARDAR CLIENTE</button></div></div>${nav('clients')}</div>`}

function ceramicPage(){

  let active=all.filter(x=>x.v.ceramic.renewalDate>=todayD),expired=all.filter(x=>x.v.ceramic.renewalDate<todayD);
  let clean=s=>String(s||'').toLowerCase().replace(/[^a-z0-9áéíóúñ ]/gi,'');
  let list=(cerTab==='expired'?expired:active).filter(({c,v})=>!q||clean([c.name,c.phone,v.plate,v.brand,v.model].join(' ')).includes(clean(q))).sort((x,y)=>x.v.ceramic.renewalDate.localeCompare(y.v.ceramic.renewalDate));

  $('#app').innerHTML=`<div class="app">${bar('Acabados cerámicos')}<div class="page"><div class="search"><input id="cerSearch" placeholder="Buscar nombre, teléfono, placa, marca..." value="${esc(cerQuery)}" oninput="cerQuery=this.value;render()"></div><div class="cerTabs"><button class="${cerTab==='active'?'on':''}" onclick="cerTab='active';render()">ACTIVOS (${active.length})</button><button class="${cerTab==='expired'?'on':''}" onclick="cerTab='expired';render()">VENCIDOS (${expired.length})</button></div>${h||'<div class="card" style="padding:20px;text-align:center;color:#8299aa">No hay tratamientos en esta sección.</div>'}</div><button class="fab" onclick="page='ceramicChoice';render()">＋</button>${nav('ceramic')}</div>`

function saveCeramic(){
  let cid=$('#cc')?.value,vid=$('#cv')?.value,c=clients.find(x=>x.id===cid),v=c?.vehicles.find(x=>x.id===vid);
  if(!v)return toast('Selecciona un vehículo');

function dailyMatchHint(){let n=$('#dn')?.value||'',p=$('#dph')?.value||'',pl=$('#dp')?.value||'',c=findClientForDaily(n,p,pl),box=$('#matchHint');if(!box)return;if(c){box.innerHTML=`<div class="matchNotice">✓ Cliente existente: <b>${esc(c.name)}</b>. No se creará duplicado.</div>`;if(!$('#dn').value.trim())$('#dn').value=c.name;if(!$('#dph').value.trim())$('#dph').value=c.phone||'';let v=pl?c.vehicles.find(v=>normPlate(v.plate)===normPlate(pl)):null;if(v&&!$('#db').value.trim())$('#db').value=v.brand||''}else box.innerHTML='<div class="quickHint">Si es un cliente nuevo, se agregará automáticamente a Clientes al guardar.</div>'}
function saveDaily(){let n=$('#dn').value.trim(),p=$('#dp').value.trim().toUpperCase(),phone=$('#dph').value.trim(),brand=$('#db').value.trim();if(!n||!p)return toast('Completa nombre y placa');let old=editDailyId?daily.find(x=>x.id===editDailyId):null,existing=findClientForDaily(n,phone,p);if(!existing){existing={id:'c'+Date.now(),name:n,phone,notes:'',vehicles:[]};clients.push(existing)}else if(!existing.phone&&phone)existing.phone=phone;let vehicle=existing.vehicles.find(v=>normPlate(v.plate)===normPlate(p));if(!vehicle)existing.vehicles.push({id:'v'+Date.now()+Math.random(),brand,model:'',plate:p,color:'',ceramic:{}});else if(!vehicle.brand&&brand)vehicle.brand=brand;let data={date:old?.date||activeJourney(),name:n,plate:p,brand,phone,amount:Number($('#da').value||0),notes:$('#dnotes').value.trim(),services:[...document.querySelectorAll('.service input:checked')].map(x=>x.value),paymentStatus:old?.paymentStatus||'pending',paymentMethod:old?.paymentMethod||'',paidDate:old?.paidDate||''};if(editDailyId)Object.assign(old,data);else daily.push({id:'d'+Date.now(),...data});save();editDailyId=null;go('daily');toast('Ingreso guardado como pendiente')}

function markPaidMethod(id,method){let r=daily.find(x=>x.id===id);if(!r)return;r.paymentStatus='paid';r.paymentMethod=method;r.paidDate=today();save();closeConfirm();render();toast('Pago registrado')}
function askCloseDay(){let d=activeJourney();askConfirm('Cerrar jornada',`¿Estás seguro de que deseas cerrar la jornada del ${fmt(d)}? Se generará un respaldo automático.`,'SÍ, CERRAR',closeDay)}
function closeDay(){let d=activeJourney();if(!currentDayRecords(d).length)return toast('No hay registros para cerrar');let x=closures.find(c=>c.date===d);if(x)x.closed=true;else closures.push({date:d,closed:true,closedAt:new Date().toISOString()});save();if(window.Android&&Android.autoBackup)Android.autoBackup(backupPayload());localStorage.removeItem(JOURNEY_KEY);startNewJourney();render();toast('Jornada cerrada y respaldo generado')}

function reportsPage(){
  let pending=daily.filter(r=>r.paymentStatus!=='paid').sort((a,b)=>a.date.localeCompare(b.date));
  let closes=closures.filter(x=>x.closed).sort((a,b)=>b.date.localeCompare(a.date));
  let paid=daily.filter(r=>r.paymentStatus==='paid').sort((a,b)=>b.date.localeCompare(a.date));
  let body='';
  if(reportTab==='pending')body=pending.map(r=>`<div class="card reportRow"><div class="topline"><div><b>${esc(r.name)}</b><div class="plate">${esc(r.plate)}</div><div class="meta">${fmt(r.date)} · ${esc((r.services||[]).join(', '))}</div></div><div class="amount">${money(r.amount)}</div></div><div class="recordBtns"><button class="pay" onclick="markPaidReport('${r.id}')">MARCAR CANCELADO</button><button onclick="wa('${r.phone}')">WHATSAPP</button></div></div>`).join('')||'<div class="card" style="padding:20px;text-align:center;color:#8299aa">No hay pendientes.</div>';
  else if(reportTab==='closures')body=closes.map(c=>{let a=daily.filter(r=>r.date===c.date),total=a.reduce((s,r)=>s+Number(r.amount||0),0),pend=a.filter(r=>r.paymentStatus==='pending').reduce((s,r)=>s+Number(r.amount||0),0);return`<div class="card reportRow"><div class="topline"><div><b>Cierre ${fmt(c.date)}</b><div class="meta">${a.length} vehículos · Pendiente ${money(pend)}</div></div><div class="amount">${money(total)}</div></div></div>`}).join('')||'<div class="card" style="padding:20px;text-align:center;color:#8299aa">No hay cierres.</div>';
  else if(reportTab==='payments'){let rd=window.reportDate||today(),a=daily.filter(r=>r.date===rd),total=a.reduce((s,r)=>s+Number(r.amount||0),0),cash=a.filter(r=>r.paymentStatus==='paid'&&(r.paymentMethod||'cash')==='cash').reduce((s,r)=>s+Number(r.amount||0),0),card=a.filter(r=>r.paymentStatus==='paid'&&r.paymentMethod==='card').reduce((s,r)=>s+Number(r.amount||0),0),sinpe=a.filter(r=>r.paymentStatus==='paid'&&r.paymentMethod==='sinpe').reduce((s,r)=>s+Number(r.amount||0),0),pend=a.filter(r=>r.paymentStatus==='pending').reduce((s,r)=>s+Number(r.amount||0),0);body=`<div class="card form"><label class="label">Fecha del reporte</label><input type="date" class="input" value="${rd}" onchange="window.reportDate=this.value;render()"></div><div class="accountingGrid"><div class="card"><small>Total</small><b>${money(total)}</b></div><div class="card"><small>Pendiente</small><b style="color:#ffbd42">${money(pend)}</b></div><div class="card"><small>Efectivo</small><b style="color:#35e695">${money(cash)}</b></div><div class="card"><small>Tarjeta</small><b style="color:#3bd8ff">${money(card)}</b></div><div class="card"><small>SINPE</small><b style="color:#c079ff">${money(sinpe)}</b></div><div class="card"><small>Vehículos</small><b>${a.length}</b></div></div>`;}
  else body=paid.map(r=>`<div class="card reportRow"><div class="topline"><div><b>${esc(r.name)}</b><div class="meta">Servicio ${fmt(r.date)} · Pago ${fmt(r.paidDate||r.date)}</div><div class="plate">${esc(r.plate)}</div></div><div class="amount">${money(r.amount)}</div></div></div>`).join('');
  $('#app').innerHTML=`<div class="app">${bar('Reportes')}<div class="page"><div class="stats"><div class="card stat"><b>${pending.length}</b><small>Pendientes</small></div><div class="card stat"><b>${money(pending.reduce((s,r)=>s+Number(r.amount||0),0))}</b><small>Por cobrar</small></div><div class="card stat"><b>${closes.length}</b><small>Cierres</small></div></div><div class="reportTabs"><button class="${reportTab==='pending'?'on':''}" onclick="reportTab='pending';render()">Pendientes</button><button class="${reportTab==='closures'?'on':''}" onclick="reportTab='closures';render()">Cierres</button><button class="${reportTab==='payments'?'on':''}" onclick="reportTab='payments';render()">Pagos</button><button class="${reportTab==='history'?'on':''}" onclick="reportTab='history';render()">Historial</button></div>${body}</div>${nav('reports')}</div>`
}
function markPaidReport(id){let r=daily.find(x=>x.id===id);if(!r)return;r.paymentStatus='paid';r.paidDate=today();save();render();toast('Pendiente cancelado')}

function appointmentsPage(){
  let list=[...appointments].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  let h=list.map(a=>`<div class="card appt"><div class="recordTop"><div><b>${esc(a.name)}</b><div class="apptTime">${fmt(a.date)} · ${esc(a.time)}</div><div class="meta">${esc(a.plate||'')} · ${esc(a.service||'Sin servicio definido')}</div></div><span class="apptStatus ${a.status||'scheduled'}">${a.status==='done'?'COMPLETADA':a.status==='cancelled'?'CANCELADA':'AGENDADA'}</span></div><div class="action2"><button class="waBtn" onclick="wa('${a.phone||''}')">☎ WHATSAPP</button><button onclick="editAppointment('${a.id}')">EDITAR</button><button class="dangerBtn" onclick="deleteAppointment('${a.id}')">ELIMINAR</button><button onclick="toggleAppointment('${a.id}')">${a.status==='done'?'REABRIR':'COMPLETAR'}</button></div></div>`).join('');
  $('#app').innerHTML=`<div class="app">${bar('Citas')}<div class="page">${h||'<div class="card" style="padding:20px;text-align:center;color:#8299aa">No hay citas agendadas.</div>'}</div><button class="fab" onclick="editApptId=null;page='appointmentForm';render()">＋</button>${nav('appointments')}</div>`
}
function editAppointment(id){editApptId=id;page='appointmentForm';render()}
function appointmentForm(){let a=editApptId?appointments.find(x=>x.id===editApptId):null;$('#app').innerHTML=`<div class="app">${bar(a?'Editar cita':'Nueva cita','appointments','<button class="headBtn" onclick="saveAppointment()">✓</button>')}<div class="page"><div class="card form"><label class="label">Cliente</label><input id="an" class="input" value="${esc(a?.name||'')}"><label class="label">Teléfono</label><input id="aph" class="input" value="${esc(a?.phone||'')}"><label class="label">Placa</label><input id="ap" class="input" value="${esc(a?.plate||'')}"><div class="row2"><div><label class="label">Fecha</label><input id="ad" type="date" class="input" value="${esc(a?.date||today())}"></div><div><label class="label">Hora</label><input id="at" type="time" class="input" value="${esc(a?.time||'08:00')}"></div></div><label class="label">Servicio</label><input id="as" class="input" value="${esc(a?.service||'')}"><label class="label">Notas</label><textarea id="ant" class="input" rows="3">${esc(a?.notes||'')}</textarea><button class="primary" onclick="saveAppointment()">GUARDAR CITA</button></div></div>${nav('appointments')}</div>`}
function saveAppointment(){let name=$('#an').value.trim(),date=$('#ad').value,time=$('#at').value;if(!name||!date||!time)return toast('Completa cliente, fecha y hora');let data={name,phone:$('#aph').value.trim(),plate:$('#ap').value.trim().toUpperCase(),date,time,service:$('#as').value.trim(),notes:$('#ant').value.trim(),status:'scheduled'};if(editApptId){let a=appointments.find(x=>x.id===editApptId);Object.assign(a,data,{status:a.status||'scheduled'})}else appointments.push({id:'a'+Date.now(),...data});save();editApptId=null;go('appointments');toast('Cita guardada')}
function deleteAppointment(id){let a=appointments.find(x=>x.id===id);askConfirm('Eliminar cita','¿Estás seguro de que deseas eliminar esta cita?','SÍ, ELIMINAR',()=>{appointments=appointments.filter(x=>x.id!==id);save();render();toast('Cita eliminada')})}
function toggleAppointment(id){let a=appointments.find(x=>x.id===id);if(!a)return;a.status=a.status==='done'?'scheduled':'done';save();render()}

function morePage(){$('#app').innerHTML=`<div class="app">${bar('Más')}<div class="page">
<div class="card form"><b>Respaldo de datos</b><div class="meta">Conserva clientes, vehículos, acabados y control diario.</div><button class="secondary" onclick="backup()">EXPORTAR RESPALDO</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">IMPORTAR / RESTAURAR</button><input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(this)"></div>
<div class="card form" style="margin-top:9px"><b>Seguridad</b><div class="meta">La sesión permanece abierta hasta que tú decidas cerrarla.</div><button class="secondary" onclick="page='changePass';render()">CAMBIAR CONTRASEÑA</button></div>
<div class="card form" style="margin-top:9px"><b>Versión</b><div class="meta">Carwash Miami 3.7</div></div>
<button class="danger" onclick="logout()">CERRAR SESIÓN</button></div>${nav('more')}</div>`}
function restoreBackup(input){
  let f=input.files?.[0];if(!f)return;
  let r=new FileReader();
  r.onload=()=>{try{
    let d=JSON.parse(r.result);
    if(!Array.isArray(d.clients)||!Array.isArray(d.daily))throw new Error();
    if(!confirm('¿Restaurar este respaldo? Reemplazará los datos actuales.'))return;
    clients=d.clients;daily=d.daily;closures=Array.isArray(d.closures)?d.closures:[];appointments=Array.isArray(d.appointments)?d.appointments:[];save();toast('Respaldo restaurado');setTimeout(()=>go('home'),500)
  }catch(e){toast('El archivo no es un respaldo válido')}};
  r.readAsText(f)
}
function changePass(){
  $('#app').innerHTML=`<div class="app">${bar('Cambiar contraseña','more')}<div class="page"><div class="card form">
  <label class="label">Contraseña actual</label><input id="oldp" type="password" class="input">
  <label class="label">Nueva contraseña</label><input id="newp" type="password" class="input">
  <label class="label">Confirmar nueva contraseña</label><input id="newp2" type="password" class="input">
  <button class="primary" onclick="savePassword()">GUARDAR CONTRASEÑA</button></div></div>${nav('more')}</div>`
}
function savePassword(){
  let oldp=$('#oldp').value,np=$('#newp').value,np2=$('#newp2').value;
  if(oldp!==auth.password)return toast('La contraseña actual no coincide');
  if(np.length<4)return toast('Usa al menos 4 caracteres');
  if(np!==np2)return toast('Las contraseñas nuevas no coinciden');
  auth.password=np;localStorage.setItem(AUTH_KEY,JSON.stringify(auth));toast('Contraseña actualizada');setTimeout(()=>go('more'),500)
}

function askConfirm(title,msg,yesText,onYes){
  confirmAction=onYes;
  let old=document.getElementById('genericConfirm');
  if(old)old.remove();
  document.body.insertAdjacentHTML('beforeend',`<div id="genericConfirm" class="confirmBox"><div class="confirmCard"><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="confirmBtns"><button onclick="closeConfirm()">NO</button><button class="yes" onclick="runConfirm()">${esc(yesText||'SÍ')}</button></div></div></div>`)
}
function closeConfirm(){
  let e=document.getElementById('genericConfirm');
  if(e)e.remove();
  confirmAction=null
}
function runConfirm(){
  let action=confirmAction;
  closeConfirm();
  if(typeof action==='function')action()
}
function confirmWhatsApp(phone){
  let n=String(phone||'').replace(/\D/g,'');
  if(!n)return toast('Cliente sin teléfono');
  askConfirm('Abrir WhatsApp','¿Deseas abrir WhatsApp para contactar a este cliente?','ABRIR WHATSAPP',()=>openWhatsAppNow(n))
}
function openWhatsAppNow(n){
  if(window.Android&&Android.openWhatsApp){
    Android.openWhatsApp(n,'Hola, te contactamos de Carwash Miami.');
    return
  }
  if(n.length===8)n='506'+n;
  location.href='https://wa.me/'+n
}

function backup(){
  let d=backupPayload();
  if(window.Android&&Android.exportBackup)Android.exportBackup(d);
  else{
    let a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));
    a.download='carwash-miami-respaldo.json';
    a.click()
  }
}
function wa(phone){confirmWhatsApp(phone)}
render();</script></body></html>
