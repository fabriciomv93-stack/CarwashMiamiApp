.sectionHead{display:flex;justify-content:space-between;align-items:center;padding:13px 13px 8px}.sectionHead h2{margin:0;font-size:18px}.count{color:#50dcc1;font-size:10px;font-weight:900}.search{position:relative;padding:0 12px 11px}.search span{position:absolute;left:25px;top:11px;color:#77918d}.search input{width:100%;padding:11px 11px 11px 38px;border-radius:10px;border:1px solid #29474a;background:#071113;color:#eaf7f3;outline:none}.search input:focus{border-color:#1fcdb0;box-shadow:0 0 0 2px #1fcdb022}
.recordCard{padding:12px;margin-top:8px}.recordTop{display:flex;justify-content:space-between;gap:10px}.name{font-size:13px;font-weight:900}.recordAmount{font-size:17px;font-weight:950;text-align:right;color:#64e4c2}.recordMeta{font-size:10px;color:#8da5a1;margin-top:4px}.badge{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:999px;font-size:9px;font-weight:900}.paid{color:#4be796;border:1px solid #267d55}.pending{color:#ffc455;border:1px solid #765a24}.recordActions{display:flex;gap:7px;margin-top:10px}.tinyBtn{flex:1;padding:9px;border-radius:9px;border:1px solid #25545a;background:#081619;color:#aeece0;font-size:10px;font-weight:900}.tinyBtn.red{color:#ff6b75;border-color:#6b2b31}
.glowBtn{width:100%;margin-top:11px;padding:13px;border:1px solid #48e1c0;border-radius:11px;background:linear-gradient(180deg,#0ba889,#086c60);color:#fff;font-weight:950;box-shadow:0 0 12px #1dd2b144,0 0 25px #1dd2b122}.secondaryBtn{width:100%;padding:12px;margin-top:9px;border-radius:10px;border:1px solid #29484d;background:#081315;color:#d1e8e2;font-weight:850}.dangerBtn{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #8a2e38;background:#16090c;color:#ff6570;font-weight:950}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:720px;margin:auto;min-height:90px;padding:7px 5px calc(16px + var(--safe));display:grid;grid-template-columns:repeat(4,1fr);background:#061012f5;border-top:1px solid #1e4145;backdrop-filter:blur(18px);box-shadow:0 -8px 25px #000b}.nav button{border:0;background:transparent;color:#718985;min-height:58px;font-size:10px;font-weight:800}.nav button.active{color:#42dec0}.navIcon{display:block;font-size:23px;line-height:1;margin-bottom:4px}
.titlebar{position:sticky;top:0;z-index:30;height:58px;display:grid;grid-template-columns:52px 1fr 78px;align-items:center;padding:0 8px;background:#061012f7;border-bottom:1px solid #1d3d41;backdrop-filter:blur(14px)}.titlebar h2{text-align:center;font-size:16px;margin:0}.titlebar button{border:0;background:transparent;color:#4fe0c3;font-weight:900}.back{font-size:26px;text-align:left}.formCard{padding:13px}.formLabel{font-size:10px;color:#a9c4be;font-weight:850;margin:9px 0 5px}.input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #29484c;background:#071113;color:#eef8f5;outline:none}.input:focus{border-color:#1ccdb0;box-shadow:0 0 0 2px #1ccdb022}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.productGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.productBtn{padding:12px;border-radius:12px;border:1px solid #28504e;background:#081517;color:#e5f6f0;text-align:left}.productBtn.sel{border-color:#45dec0;background:linear-gradient(145deg,#0b3b34,#0a6659);box-shadow:0 0 12px #1ed1ad33}.productBtn b{display:block;font-size:12px}.productBtn small{display:block;color:#91aaa5;margin-top:4px}.cartRow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #173238}.qty{display:flex;align-items:center;gap:7px}.qty button{width:28px;height:28px;border-radius:8px;border:1px solid #2b5756;background:#081718;color:#aeece0}.totalBox{padding:13px;margin-top:10px;border:1px solid #286158;border-radius:13px;background:#09201c}.totalBox div{display:flex;justify-content:space-between;margin:4px 0}.totalBox strong{font-size:23px;color:#5ce4c1}

.loginScreen{min-height:100vh;display:grid;place-items:center;padding:22px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 5%,#0d594c66,transparent 30%),linear-gradient(180deg,#04100e,#071113)}.loginScreen:before{content:"🥕   🥒   🌶️   🍅   🫑   🥑   🍋   🥕";position:absolute;top:8%;left:-20%;width:140%;font-size:50px;letter-spacing:12px;line-height:1.8;opacity:.16;transform:rotate(-7deg);filter:saturate(1.2)}.loginScreen:after{content:"🍽️   🥗   🥕   🌶️";position:absolute;bottom:9%;right:-8%;font-size:55px;opacity:.12;transform:rotate(5deg)}.loginCard{position:relative;z-index:2;width:min(92vw,430px);padding:26px 20px;border:1px solid #2a7062;border-radius:23px;background:linear-gradient(180deg,#0b1d1bfa,#061110fa);box-shadow:0 0 30px #18cdb233,0 25px 60px #000c}.loginBrand{text-align:center;margin-bottom:20px}.bigLogo{font-size:31px;font-weight:1000;letter-spacing:1px;color:#f3fbf8;text-shadow:0 0 18px #26d5b044}.bigLogo span{color:#4be1c0}.loginBrand small{display:block;color:#9bb6b0;margin-top:5px}.loginFood{font-size:31px;margin-bottom:7px}.loginHint{margin-top:13px;padding:9px;border:1px solid #244a48;border-radius:9px;background:#071514;color:#819a95;font-size:10px;text-align:center}.securityNote{padding:10px;border-radius:9px;border:1px solid #294c4a;background:#071514;color:#829a96;font-size:10px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(112px + var(--safe));transform:translateX(-50%);z-index:120;background:#092c27;border:1px solid #2c9e89;padding:10px 14px;border-radius:9px;font-size:12px}.modalBg{position:fixed;inset:0;z-index:100;background:#000c;display:grid;place-items:center;padding:18px}.modal{max-width:370px;width:100%;padding:22px;border-radius:15px;border:1px solid #8a3038;background:#090d0d;text-align:center}.modal h2{color:#ff5b66}.modal p{font-size:12px;line-height:1.5}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px}.cancel,.delete{padding:11px;border:0;border-radius:8px;font-weight:900}.cancel{background:#1a2020;color:#fff}.delete{background:#d62b36;color:#fff}

.welcome{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}.welcome h1{margin:3px 0 2px;font-size:25px;letter-spacing:-.5px}.welcome p{margin:0;color:#819793;font-size:11px}.eyebrow{font-size:9px;letter-spacing:2px;color:#59c9a9;font-weight:800}.todayIcon{width:44px;height:44px;border-radius:14px;background:rgba(79,197,163,.12);border:1px solid rgba(79,197,163,.2);display:flex;align-items:center;justify-content:center;font-size:21px}.mainBalance{display:flex;justify-content:space-between;align-items:center;padding:18px;border-radius:20px;margin-bottom:12px;background:linear-gradient(135deg,#102d29,#123a32);border:1px solid rgba(100,220,180,.16);box-shadow:0 10px 30px rgba(0,0,0,.16)}.mainBalance small{display:block;color:#83b9ac;font-size:9px;letter-spacing:1.5px;font-weight:800}.mainBalance strong{display:block;font-size:27px;margin:5px 0 2px}.mainBalance span{font-size:9px;color:#87a49f}.balanceMark{width:48px;height:48px;border-radius:16px;background:rgba(93,213,177,.13);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#72d7b9}.quickGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quickCard{border:1px solid #213e3a;background:#102522;color:#e7f4f0;border-radius:17px;padding:14px;text-align:left;min-height:88px;display:flex;flex-direction:column;gap:3px}.quickCard span{font-size:18px;color:#67ceb0}.quickCard b{font-size:12px}.quickCard small{font-size:9px;color:#78918d}.quickCard.primary{background:linear-gradient(135deg,#146a58,#0f4d43);border-color:#2b9b80}.debtText{color:#ffb36d!important}.paidText{color:#69d6b6!important}

/* ===== MENU SIMPLE V4: pensado para uso fácil ===== */
body{background:radial-gradient(circle at 50% -10%,#174c4f 0,#071416 38%,#050a0b 100%);}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:24px}
.hero{display:none!important}
.simpleHome{padding:18px 16px 30px}
.simpleBrand{display:flex;align-items:center;gap:14px;margin:4px 4px 18px}
.simpleLogo{width:68px;height:68px;border-radius:22px;background:linear-gradient(145deg,#28d8b4,#087f78);display:grid;place-items:center;box-shadow:0 12px 30px #0008;border:1px solid #74f4d8}
.simpleLogo svg{width:45px;height:45px}
.simpleBrand h1{margin:0;font-size:27px;letter-spacing:-.5px}.simpleBrand p{margin:4px 0 0;color:#9cb9b5;font-size:12px}
.simpleQuestion{text-align:center;margin:4px 0 18px}.simpleQuestion h2{font-size:22px;margin:0 0 5px}.simpleQuestion p{margin:0;color:#8ca8a5;font-size:12px}
.bigMenu{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bigBtn{position:relative;min-height:154px;border:1px solid #285456;border-radius:24px;background:linear-gradient(145deg,#112527,#0b1719);color:#eefdfa;padding:18px 16px;text-align:left;overflow:hidden;box-shadow:0 10px 24px #0006;transition:.15s;cursor:pointer}
.bigBtn:active{transform:scale(.98)}.bigBtn:after{content:"";position:absolute;width:95px;height:95px;border-radius:50%;right:-30px;top:-30px;background:#25d6b433}
.bigBtn .art{width:62px;height:62px;border-radius:19px;display:grid;place-items:center;margin-bottom:12px;background:#173a3b;border:1px solid #2b6463;box-shadow:inset 0 1px #ffffff18}.bigBtn svg{width:38px;height:38px}
.bigBtn b{display:block;font-size:17px;line-height:1.1}.bigBtn small{display:block;color:#8eaaa6;font-size:11px;margin-top:6px;line-height:1.25}
.bigBtn.primary{grid-column:1/-1;min-height:126px;background:linear-gradient(135deg,#0c655e,#0d302f 72%);border-color:#36d7ba}.bigBtn.primary .art{background:#0e8d7f;border-color:#62ead4}.bigBtn.primary b{font-size:20px}
.bigBtn.cash .art{background:#183d2d}.bigBtn.customer .art{background:#27375c}.bigBtn.product .art{background:#5a3b20}.bigBtn.expense .art{background:#512e36}.bigBtn.report .art{background:#40335e}
.menuFooter{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.footerBtn{min-height:58px;border:1px solid #264749;border-radius:18px;background:#0c191b;color:#cbe0dc;font-weight:800;font-size:12px}.footerBtn span{font-size:19px;margin-right:6px}
.simpleHint{margin:18px 4px 0;padding:13px 15px;border:1px solid #203c3e;border-radius:16px;background:#091517;color:#799592;font-size:11px;text-align:center}
@media(max-width:420px){.bigMenu{gap:10px}.bigBtn{min-height:145px;padding:15px 13px}.bigBtn.primary{min-height:120px}.bigBtn b{font-size:15px}.bigBtn.primary b{font-size:18px}}

/* Identidad visual por sección: ayuda a distinguir cada pantalla */
.bigBtn.production .art{background:#35512e}

/* ===== V8: IDENTIDAD VISUAL POR SECCIÓN ===== */
/* Cada sección tiene su propio "ambiente" para que sea fácil reconocer dónde está la persona. */
body[data-page="home"]{background:radial-gradient(circle at 50% 0%,#d8f4e9 0,#9bd8c7 34%,#5b9e91 100%);color:#173b36}
body[data-page="home"] .simpleHome{color:#173b36}
body[data-page="home"] .simpleBrand p,body[data-page="home"] .simpleQuestion p{color:#315f58}
body[data-page="home"] .simpleQuestion h2{color:#123d37}

/* Ventas: azul claro, tarjetas rectangulares y botones firmes */
body[data-page="sales"],body[data-page="saleForm"],body[data-page="customerSales"]{background:radial-gradient(circle at 85% -10%,#bfe7ff 0,#6ea8d0 36%,#365d82 100%)}

body[data-page="sales"] .back,body[data-page="saleForm"] .back,body[data-page="customerSales"] .back{color:#a9e0ff}

<body>
<div id="loginScreen" class="loginScreen"><div class="loginCard"><div class="loginBrand"><div class="loginFood">🍽️🥗</div><div class="bigLogo">VENTAS<span>PRO</span></div><small>Control de ventas · gastos · ganancias</small></div><div class="formLabel">Usuario</div><input id="loginUser" class="input" value="admin" autocomplete="username"><div class="formLabel">Contraseña</div><input id="loginPass" class="input" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')loginApp()"><button class="glowBtn" onclick="loginApp()">INGRESAR</button><div class="loginHint">Sistema privado de control del negocio</div></div></div>
<div id="mainApp" class="app hidden"><div id="hero" class="hero"><div class="heroGlow"><div class="eyebrow">VENTAS · COMIDAS · CONTROL</div><h1>Mi negocio</h1><p>Registra ventas, productos, gastos y ganancias en un solo lugar.</p></div></div><main id="view"></main></div>
<div id="toast" class="toast hidden"></div><div id="modal" class="hidden"></div>
<script>
const PRODUCTS_KEY='food_products_v1',SALES_KEY='food_sales_v1',EXPENSE_KEY='food_expenses_v1',CUSTOMERS_KEY='food_customers_v1',ABONOS_KEY='food_abonos_v1',PRODUCTION_KEY='food_production_v1';
let products=JSON.parse(localStorage.getItem(PRODUCTS_KEY)||'[]'),sales=JSON.parse(localStorage.getItem(SALES_KEY)||'[]'),expenses=JSON.parse(localStorage.getItem(EXPENSE_KEY)||'[]'),customers=JSON.parse(localStorage.getItem(CUSTOMERS_KEY)||'[]'),abonos=JSON.parse(localStorage.getItem(ABONOS_KEY)||'[]'),production=JSON.parse(localStorage.getItem(PRODUCTION_KEY)||'[]');
let page='login',editId=null,editExpenseId=null,cart=[],editingSaleId=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(PRODUCTS_KEY,JSON.stringify(products));localStorage.setItem(SALES_KEY,JSON.stringify(sales));localStorage.setItem(EXPENSE_KEY,JSON.stringify(expenses));localStorage.setItem(CUSTOMERS_KEY,JSON.stringify(customers));localStorage.setItem(ABONOS_KEY,JSON.stringify(abonos));localStorage.setItem(PRODUCTION_KEY,JSON.stringify(production));}
function todayIso(){return new Date().toISOString().slice(0,10)}function colones(n){return '₡'+Number(n||0).toLocaleString('es-CR',{maximumFractionDigits:0})}function fmt(i){if(!i)return'—';let[y,m,d]=i.split('-');return `${d}/${m}/${y}`}function toast(m){let t=$('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function loginApp(){const u=$('loginUser').value.trim(),p=$('loginPass').value;let ok=false;try{ok=window.Android?.checkLogin?Android.checkLogin(u,p):(u==='admin'&&p==='admin')}catch(e){}if(!ok){$('loginPass').value='';toast('Usuario o contraseña incorrectos');return}$('loginScreen').classList.add('hidden');$('mainApp').classList.remove('hidden');go('home')}
function logoutToLogin(){document.body.dataset.page='login';$('mainApp').classList.add('hidden');$('loginScreen').classList.remove('hidden');$('loginPass').value='';page='login'}function askExit(){if(confirm('¿Deseas salir de la aplicación?'))window.Android?.exitApp?.()}
window.handleAndroidBack=function(){if(page==='login'||page==='home'){askExit();return}if(page==='saleForm'){go('sales');return}if(page==='productForm'){go('products');return}if(page==='customerForm'||page==='customerDetail'){go('customers');return}if(page==='expenseForm'){go('expenses');return}if(page==='abonoForm'){go('sales');return}if(page==='customerSales'){go('sales');return}if(page==='security'){go('settings');return}if(page==='productionForm'){go('production');return}if(page==='backup'){go('settings');return}go('home')};
function nav(){}function go(p){page=p;editId=null;document.body.dataset.page=p;$('hero').classList.toggle('hidden',p!=='home');render();nav();scrollTo(0,0)}function bar(title,right=''){return `<div class="titlebar"><button class="back" onclick="go('home')">‹</button><h2>${title}</h2><div>${right}</div></div>`}
function saleAbonos(s){return abonos.filter(a=>a.status!=='anulado'&&a.saleId===s.id)}
function saleAbonoTotal(s){return saleAbonos(s).reduce((x,a)=>x+(+a.amount||0),0)}
function salePaidTotal(s){return Math.min(+s.total||0,(+s.paidAmount||0)+saleAbonoTotal(s))}
function saleBalance(s){return Math.max(0,(+s.total||0)-salePaidTotal(s))}
function salesForDate(d){return sales.filter(s=>s.date===d).reduce((a,s)=>a+(+s.total||0),0)}
function paidForDate(d){let direct=sales.filter(s=>s.date===d).reduce((a,s)=>a+(+s.paidAmount||0),0);let deposits=abonos.filter(a=>a.status!=='anulado'&&a.date===d).reduce((x,a)=>x+(+a.amount||0),0);return direct+deposits}
function expensesForDate(d){return expenses.filter(e=>e.date===d).reduce((a,e)=>a+(+e.amount||0),0)}
function pendingForDate(d){return sales.filter(s=>s.date===d).reduce((a,s)=>a+saleBalance(s),0)}
function totalPending(){return sales.reduce((a,s)=>a+saleBalance(s),0)}
function totalAbonos(){return abonos.filter(a=>a.status!=='anulado').reduce((x,a)=>x+(+a.amount||0),0)}
function customerDebt(name){return sales.filter(s=>(s.customer||'Cuenta general')===(name||'Cuenta general')).reduce((a,s)=>a+saleBalance(s),0)}
function home(){
$('view').innerHTML=`<div class="simpleHome">
  <div class="simpleBrand">
    <div class="simpleLogo"><svg viewBox="0 0 64 64" fill="none"><path d="M12 27h40v25H12z" fill="#fff" opacity=".95"/><path d="M8 25 13 12h38l5 13H8Z" fill="#dffef7"/><path d="M9 25h46" stroke="#087f78" stroke-width="4"/><path d="M20 33h9v19h-9zM36 33h9v19h-9z" fill="#0b9c8d"/><circle cx="48" cy="17" r="6" fill="#ffd36b"/><path d="M45 17h6M48 14v6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div>
    <div><h1>Mi negocio</h1><p>Todo más fácil, en un solo lugar</p></div>
  </div>
  <div class="simpleQuestion"><h2>¿Qué desea hacer?</h2><p>Toque una opción para comenzar</p></div>
  <div class="bigMenu">
    <button class="bigBtn primary" onclick="openSaleForm()"><div class="art"><svg viewBox="0 0 48 48" fill="none"><path d="M8 16h32v24H8z" stroke="white" stroke-width="3"/><path d="M12 16 16 8h16l4 8" stroke="white" stroke-width="3"/><path d="M17 24h14M17 30h9" stroke="#9fffee" stroke-width="3" stroke-linecap="round"/><path d="M35 32v10M30 37h10" stroke="#ffd36b" stroke-width="3" stroke-linecap="round"/></svg></div><b>NUEVA VENTA</b><small>Registrar una venta nueva</small></button>
    <button class="bigBtn customer" onclick="go('customers')"><div class="art"><svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="16" r="7" stroke="white" stroke-width="3"/><path d="M11 39c1-8 6-12 13-12s12 4 13 12" stroke="white" stroke-width="3" stroke-linecap="round"/><path d="M36 13v8M32 17h8" stroke="#a8c2ff" stroke-width="3" stroke-linecap="round"/></svg></div><b>CLIENTES</b><small>Buscar cliente y sus ventas</small></button>
    <button class="bigBtn production" onclick="go('production')"><div class="art"><svg viewBox="0 0 48 48" fill="none"><path d="M8 30h32v9H8z" stroke="white" stroke-width="3"/><path d="M12 30c1-9 5-14 12-14s11 5 12 14" stroke="white" stroke-width="3"/><path d="M18 11c1 2 3 3 6 3s5-1 6-3" stroke="#ffd36b" stroke-width="3" stroke-linecap="round"/><path d="M24 7v7" stroke="#9fffee" stroke-width="3" stroke-linecap="round"/></svg></div><b>PRODUCCIÓN</b><small>Registrar lo que preparó hoy</small></button>
    <button class="bigBtn cash" onclick="go('sales')"><div class="art"><svg viewBox="0 0 48 48" fill="none"><rect x="7" y="12" width="34" height="25" rx="4" stroke="white" stroke-width="3"/><circle cx="24" cy="24.5" r="7" stroke="#b9ffd5" stroke-width="3"/><path d="M24 20v9M27 22c-1-2-6-2-6 1 0 3 6 1 6 4 0 3-5 3-7 1" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></div><b>COBRAR / ABONO</b><small>Buscar una cuenta y recibir pago</small></button>
    <button class="bigBtn product" onclick="go('products')"><div class="art"><svg viewBox="0 0 48 48" fill="none"><path d="M8 18h32v21H8z" stroke="white" stroke-width="3"/><path d="M8 18 14 9h20l6 9M16 25h16M16 31h10" stroke="white" stroke-width="3" stroke-linecap="round"/><path d="M31 8v8" stroke="#ffd36b" stroke-width="3" stroke-linecap="round"/></svg></div><b>PRODUCTOS</b><small>Ver y cambiar precios</small></button>
    <button class="bigBtn expense" onclick="go('expenses')"><div class="art"><svg viewBox="0 0 48 48" fill="none"><path d="M10 12h28v25H10z" stroke="white" stroke-width="3"/><path d="M15 12V8h18v4M17 20h14M17 27h9" stroke="white" stroke-width="3" stroke-linecap="round"/><path d="m30 30 4 4 7-8" stroke="#ff9ba7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><b>GASTOS</b><small>Anotar un gasto del negocio</small></button>
    <button class="bigBtn report" onclick="go('summary')"><div class="art"><svg viewBox="0 0 48 48" fill="none"><path d="M9 38V10M9 38h31" stroke="white" stroke-width="3" stroke-linecap="round"/><path d="m15 31 7-8 6 4 8-12" stroke="#d6c5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="15" r="3" fill="#d6c5ff"/></svg></div><b>RESUMEN</b><small>Ventas, gastos y ganancias</small></button>
  </div>
  <div class="menuFooter"><button class="footerBtn" onclick="go('settings')"><span>⚙</span>CONFIGURACIÓN</button></div>
  <div class="simpleHint">💡 Consejo: para registrar una venta, solo toque <b>NUEVA VENTA</b>.</div>
</div>`
}
function salesPage(date=todayIso()){let a=sales.filter(s=>s.date===date).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));let total=salesForDate(date),paid=paidForDate(date);let names=[...new Set(customers.map(c=>c.name).concat(a.map(s=>s.customer||'')).filter(Boolean))].sort((x,y)=>x.localeCompare(y));$('view').innerHTML=bar('Ventas',`<button onclick="openSaleForm()">＋</button>`)+`<div class="page"><div class="panel formCard"><div class="formLabel">Fecha</div><input class="input" type="date" value="${date}" onchange="salesPage(this.value)"><div class="summaryBar"><div class="summaryCell"><b>${colones(total)}</b><small>Facturado</small></div><div class="summaryCell"><b>${colones(paid)}</b><small>Cobrado hoy</small></div></div><div class="formLabel">Buscar cliente</div><div class="search"><span>⌕</span><input id="salesCustomerSearch" placeholder="Nombre del cliente" oninput="filterSalesCustomers()"></div><div id="salesCustomerList">${names.map(salesCustomerRow).join('')||'<div style="padding:10px 0;color:#819793;font-size:11px">Primero registra un cliente o una venta con nombre.</div>'}</div><button class="glowBtn" onclick="openSaleForm(null,'${date}')">＋ REGISTRAR VENTA</button></div><div class="sectionHead"><h2>Ventas del día</h2><div class="count">${a.length} registros</div></div>${a.map(saleCard).join('')||'<div class="panel" style="padding:22px;text-align:center;color:#819793">No hay ventas registradas.</div>'}</div>`}
function salesCustomerRow(name){let debt=customerDebt(name);return `<div class="listItem" onclick="customerSalesPage('${esc(name).replace(/'/g,"\\'")}')"><div><b>${esc(name)}</b><small>${debt>0?colones(debt)+' pendiente':'Sin saldo pendiente'}</small></div><span style="color:#55dec0">›</span></div>`}
function filterSalesCustomers(){let q=($('salesCustomerSearch')?.value||'').toLowerCase();let names=[...new Set(customers.map(c=>c.name).concat(sales.map(s=>s.customer||'')).filter(Boolean))].filter(n=>n.toLowerCase().includes(q)).sort((x,y)=>x.localeCompare(y));$('salesCustomerList').innerHTML=names.map(salesCustomerRow).join('')||'<div style="padding:10px 0;color:#819793;font-size:11px">No se encontró el cliente.</div>'}
function customerSalesPage(name){page='customerSales';$('hero').classList.add('hidden');nav();let a=sales.filter(s=>(s.customer||'Cuenta general')===name).sort((x,y)=>((y.date||'')+(y.createdAt||'')).localeCompare((x.date||'')+(x.createdAt||'')));let debt=customerDebt(name);$('view').innerHTML=bar(name,`<button onclick="go('sales')">VENTAS</button>`)+`<div class="page"><div class="panel" style="padding:14px"><div class="summaryBar"><div class="summaryCell"><b>${colones(a.reduce((x,s)=>x+(+s.total||0),0))}</b><small>Total vendido</small></div><div class="summaryCell"><b>${colones(debt)}</b><small>Saldo pendiente</small></div></div><div style="font-size:10px;color:#819793;margin-top:8px">Selecciona una venta para aplicar un abono únicamente a esa cuenta.</div></div><div class="sectionHead"><h2>Ventas de ${esc(name)}</h2><div class="count">${a.length} ventas</div></div>${a.map(customerSaleCard).join('')||'<div class="panel" style="padding:22px;text-align:center;color:#819793">Este cliente no tiene ventas registradas.</div>'}</div>`}
function customerSaleCard(s){let balance=saleBalance(s),ab=saleAbonos(s);let items=(s.items||[]).map(i=>`${esc(i.name)} ×${i.qty}`).join(' · ');return `<div class="panel recordCard"><div class="recordTop"><div><div class="name">${fmt(s.date)}</div><div class="recordMeta">${items||'Venta registrada'}</div><span class="badge ${balance>0?'pending':'paid'}">${balance>0?'PENDIENTE':'CANCELADA'}</span></div><div class="recordAmount">${colones(s.total)}<div style="font-size:9px;color:#819793">Pagado ${colones(salePaidTotal(s))} · Saldo ${colones(balance)}</div></div></div><div class="recordActions">${balance>0?`<button class="tinyBtn" onclick="openAbonoForSale('${s.id}')">＋ ABONO</button>`:''}<button class="tinyBtn" onclick="showSaleAbonos('${s.id}')">${ab.length?'VER ABONOS ('+ab.length+')':'DETALLE'}</button><button class="tinyBtn" onclick="openSaleForm('${s.id}')">EDITAR</button></div></div>`}
function saleCard(s){let items=(s.items||[]).map(i=>`${esc(i.name)} ×${i.qty}`).join(' · '),balance=saleBalance(s);return `<div class="panel recordCard"><div class="recordTop"><div><div class="name">${esc(s.customer||'Venta mostrador')}</div><div class="recordMeta">${items}</div><span class="badge ${balance>0?'pending':'paid'}">${balance>0?'PENDIENTE':'PAGADO'}</span></div><div class="recordAmount">${colones(s.total)}<div style="font-size:9px;color:#819793">Cobrado ${colones(salePaidTotal(s))} · Saldo ${colones(balance)}</div></div></div><div class="recordActions">${s.customer&&balance>0?`<button class="tinyBtn" onclick="openAbonoForSale('${s.id}')">＋ ABONO</button>`:''}<button class="tinyBtn" onclick="openSaleForm('${s.id}')">EDITAR</button><button class="tinyBtn red" onclick="deleteSale('${s.id}')">ELIMINAR</button></div></div>`}
function openSaleForm(id,date=todayIso()){page='saleForm';$('hero').classList.add('hidden');nav();editingSaleId=id||null;let s=id?sales.find(x=>x.id===id):null;cart=s?(s.items||[]).map(i=>({...i})):[];$('view').innerHTML=bar(s?'Editar venta':'Nueva venta',`<button onclick="saveSale()">GUARDAR</button>`)+`<div class="page"><div class="panel formCard"><div class="formLabel">Fecha</div><input id="saleDate" type="date" class="input" value="${s?.date||date}"><div class="formLabel">Cliente (opcional)</div><input id="saleCustomer" class="input" value="${esc(s?.customer||'')}" placeholder="Ej. Juan Pérez"><div class="formLabel">Productos</div><div id="productPicker" class="productGrid">${products.filter(p=>p.active!==false).map(p=>`<button type="button" class="productBtn" onclick="addToCart('${p.id}')"><b>${esc(p.name)}</b><small>${colones(p.price)}</small></button>`).join('')||'<div style="grid-column:1/-1;color:#819793;font-size:11px;padding:10px">Primero agrega productos en Productos.</div>'}</div><div id="cartBox"></div><div class="formLabel">Monto pagado</div><input id="salePaid" class="input" type="number" min="0" inputmode="numeric" value="${s?.paidAmount??s?.total??''}" oninput="updateSaleTotal()"><div class="formLabel">Estado de pago</div><select id="saleStatus" class="input"><option value="pagado" ${(s?.status||'pagado')==='pagado'?'selected':''}>Pagado</option><option value="pendiente" ${(s?.status||'pagado')==='pendiente'?'selected':''}>Pendiente</option></select><button class="glowBtn" onclick="saveSale()">GUARDAR VENTA</button><button class="secondaryBtn" onclick="go('sales')">CANCELAR</button></div></div>`;renderCart()}
function addToCart(id){let p=products.find(x=>x.id===id);if(!p)return;let x=cart.find(i=>i.productId===id);if(x)x.qty++;else cart.push({productId:p.id,name:p.name,price:+p.price||0,qty:1});renderCart()}
function changeQty(i,delta){if(!cart[i])return;cart[i].qty+=delta;if(cart[i].qty<=0)cart.splice(i,1);renderCart()}function cartTotal(){return cart.reduce((a,i)=>a+(+i.price||0)*(+i.qty||0),0)}
function renderCart(){let box=$('cartBox');if(!box)return;box.innerHTML=`<div class="panel" style="padding:11px;margin-top:10px"><b style="font-size:12px">Detalle de la venta</b>${cart.map((i,n)=>`<div class="cartRow"><div><b style="font-size:11px">${esc(i.name)}</b><div style="font-size:9px;color:#829b96">${colones(i.price)} c/u</div></div><div class="qty"><button onclick="changeQty(${n},-1)">−</button><span>${i.qty}</span><button onclick="changeQty(${n},1)">+</button></div><b style="font-size:11px">${colones(i.price*i.qty)}</b></div>`).join('')||'<div style="padding:12px 0;color:#819793;font-size:10px">Selecciona productos para agregarlos.</div>'}<div class="totalBox"><div><span>Total</span><strong>${colones(cartTotal())}</strong></div></div></div>`;let paid=$('salePaid');if(paid&&!paid.value)paid.value=cartTotal();updateSaleTotal()}
function updateSaleTotal(){let paid=$('salePaid'),total=cartTotal();if(paid&&+paid.value>total)paid.value=total}
function saveSale(){let date=$('saleDate').value,customer=$('saleCustomer').value.trim(),total=cartTotal(),paidAmount=+$('salePaid').value||0,status=$('saleStatus').value;if(!date||!total)return toast('Agrega al menos un producto');if(paidAmount>total)paidAmount=total;if(paidAmount>=total)status='pagado';let obj={date,customer,total,paidAmount,status,items:cart.map(i=>({...i})),updatedAt:Date.now()};if(editingSaleId){let s=sales.find(x=>x.id===editingSaleId);Object.assign(s,obj)}else sales.push({id:'S'+Date.now(),...obj,createdAt:Date.now()});save();toast('Venta guardada');salesPage(date)}function deleteSale(id){if(!confirm('¿Eliminar esta venta?'))return;abonos=abonos.filter(a=>a.saleId!==id);sales=sales.filter(s=>s.id!==id);save();toast('Venta eliminada');salesPage()}
function showSaleAbonos(id){let s=sales.find(x=>x.id===id);if(!s)return;let a=saleAbonos(s);alert(a.length?a.map(x=>`${fmt(x.date)} — ${colones(x.amount)}${x.note?' — '+x.note:''}`).join('\n'):'Esta venta no tiene abonos registrados.')}function openAbonoForSale(id){let s=sales.find(x=>x.id===id);if(!s)return;let balance=saleBalance(s);if(balance<=0)return toast('Esta venta ya está cancelada');page='abonoForm';$('hero').classList.add('hidden');nav();$('view').innerHTML=bar('Aplicar abono',`<button onclick="saveSaleAbono('${s.id}')">GUARDAR</button>`)+`<div class="page"><div class="panel formCard"><div class="recordTop"><div><div class="name">${esc(s.customer||'Venta mostrador')}</div><div class="recordMeta">Venta del ${fmt(s.date)}</div></div><div class="recordAmount">${colones(s.total)}</div></div><div class="summaryBar"><div class="summaryCell"><b>${colones(salePaidTotal(s))}</b><small>Pagado</small></div><div class="summaryCell"><b>${colones(balance)}</b><small>Saldo pendiente</small></div></div><div class="formLabel">Fecha del abono</div><input id="saleAbDate" type="date" class="input" value="${todayIso()}"><div class="formLabel">Monto del abono</div><input id="saleAbAmount" class="input" type="number" min="1" max="${balance}" inputmode="numeric" placeholder="Máximo ${balance}"><div class="formLabel">Nota (opcional)</div><input id="saleAbNote" class="input" placeholder="Ej. Abono en efectivo"><button class="glowBtn" onclick="saveSaleAbono('${s.id}')">APLICAR ABONO</button><button class="secondaryBtn" onclick="customerSalesPage('${esc(s.customer||'Cuenta general').replace(/'/g,"\\'")}')">CANCELAR</button></div></div>`}
function saveSaleAbono(id){let s=sales.find(x=>x.id===id);if(!s)return;let date=$('saleAbDate').value,amount=+$('saleAbAmount').value||0,note=$('saleAbNote').value.trim(),balance=saleBalance(s);if(!date||amount<=0)return toast('Completa la fecha y el monto');if(amount>balance)return toast('El abono supera el saldo de esta venta');abonos.push({id:'A'+Date.now(),saleId:s.id,date,customer:s.customer||'Cuenta general',amount,note,status:'aplicado',createdAt:Date.now()});save();toast(amount===balance?'Venta cancelada':'Abono aplicado');customerSalesPage(s.customer||'Cuenta general')}
function abonosPage(){let active=abonos.filter(a=>a.status!=='anulado').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)),cancel=abonos.filter(a=>a.status==='anulado').sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));$('view').innerHTML=bar('Historial de abonos')+`<div class="page"><div class="metrics"><div class="metric"><div class="icon">₡</div><b>${colones(totalPending())}</b><small>Cuenta pendiente</small></div><div class="metric"><div class="icon">✓</div><b>${colones(totalAbonos())}</b><small>Abonos aplicados</small></div></div><div class="sectionHead"><h2>Abonos registrados</h2><div class="count">${active.length}</div></div>${active.map(a=>abonoCard(a,false)).join('')||'<div class="panel" style="padding:22px;text-align:center;color:#819793">No hay abonos registrados.</div>'}<div class="sectionHead"><h2>Historial cancelado</h2><div class="count">${cancel.length}</div></div>${cancel.map(a=>abonoCard(a,true)).join('')||'<div class="panel" style="padding:18px;text-align:center;color:#819793">No hay abonos cancelados.</div>'}</div>`}
function abonoCard(a,cancelado){let s=a.saleId?sales.find(x=>x.id===a.saleId):null;return `<div class="panel recordCard"><div class="recordTop"><div><div class="name">${esc(a.customer||'Cuenta general')}</div><div class="recordMeta">${s?'Venta del '+fmt(s.date)+' · ':''}${fmt(a.date)} · ${esc(a.note||'Abono')}</div></div><div class="recordAmount">${colones(a.amount)}</div></div><span class="badge ${cancelado?'pending':'paid'}">${cancelado?'ANULADO':'APLICADO'}</span>${!cancelado?`<div class="recordActions"><button class="tinyBtn red" onclick="cancelAbono('${a.id}')">ANULAR ABONO</button></div>`:''}</div>`}
function openAbonoForm(){go('abonos')}function saveAbono(){toast('Los abonos se registran desde Ventas: busca el cliente y selecciona la venta.')}function cancelAbono(id){let a=abonos.find(x=>x.id===id);if(!a||a.status==='anulado')return;if(!confirm('¿Anular este abono? El monto volverá al saldo pendiente de la venta.'))return;a.status='anulado';a.updatedAt=Date.now();save();toast('Abono anulado');if(a.saleId){let s=sales.find(x=>x.id===a.saleId);if(s)customerSalesPage(s.customer||'Cuenta general');else go('sales')}else go('abonos')}
function summaryPage(){let d=todayIso(),v=salesForDate(d),g=expensesForDate(d),p=paidForDate(d),pending=totalPending(),profit=v-g;$('view').innerHTML=bar('Resumen')+`<div class="page"><div class="panel formCard"><div class="welcome"><div><div class="eyebrow">RESUMEN DEL NEGOCIO</div><h1 style="margin:3px 0;font-size:22px">Hoy</h1><p>${fmt(d)}</p></div><div class="todayIcon">📊</div></div><div class="mainBalance"><div><small>GANANCIA ESTIMADA</small><strong>${colones(profit)}</strong><span>Ventas menos gastos</span></div><div class="balanceMark">₡</div></div><div class="metrics"><div class="metric"><div class="icon">↗</div><b>${colones(v)}</b><small>Vendido</small></div><div class="metric"><div class="icon">✓</div><b>${colones(p)}</b><small>Cobrado</small></div><div class="metric"><div class="icon">$</div><b>${colones(pending)}</b><small>Por cobrar</small></div><div class="metric"><div class="icon">−</div><b>${colones(g)}</b><small>Gastos</small></div></div></div><div class="simpleHint">Este resumen se actualiza automáticamente cuando registra ventas, pagos y gastos.</div></div>`}

function productsPage(){$('view').innerHTML=bar('Productos',`<button onclick="openProductForm()">＋</button>`)+`<div class="page"><div class="panel"><div class="sectionHead"><h2>Productos</h2><div class="count">${products.length} registrados</div></div>${products.map(p=>`<div class="listItem"><div><b>${esc(p.name)}</b><small>${p.active===false?'Inactivo':'Disponible'}</small></div><div style="text-align:right"><div class="price">${colones(p.price)}</div><button class="tinyBtn" style="margin-top:5px" onclick="openProductForm('${p.id}')">EDITAR</button></div></div>`).join('')||'<div style="padding:20px;text-align:center;color:#819793">No hay productos.</div>'}</div><button class="glowBtn" onclick="openProductForm()">＋ AGREGAR PRODUCTO</button></div>`}
function openProductForm(id){page='productForm';$('hero').classList.add('hidden');nav();editId=id||null;let p=id?products.find(x=>x.id===id):null;$('view').innerHTML=bar(p?'Editar producto':'Agregar producto',`<button onclick="saveProduct()">GUARDAR</button>`)+`<div class="page"><div class="panel formCard"><div class="formLabel">Nombre del producto</div><input id="prodName" class="input" value="${esc(p?.name||'')}" placeholder="Ej. Escabeche 500 g"><div class="formLabel">Precio de venta</div><input id="prodPrice" class="input" type="number" min="0" inputmode="numeric" value="${esc(p?.price||'')}" placeholder="2500"><div class="formLabel">Estado</div><select id="prodActive" class="input"><option value="true" ${p?.active!==false?'selected':''}>Disponible</option><option value="false" ${p?.active===false?'selected':''}>Inactivo</option></select><button class="glowBtn" onclick="saveProduct()">GUARDAR PRODUCTO</button><button class="secondaryBtn" onclick="go('products')">CANCELAR</button></div></div>`}
function saveProduct(){let name=$('prodName').value.trim(),price=+$('prodPrice').value||0,active=$('prodActive').value==='true';if(!name||price<=0)return toast('Completa nombre y precio');if(editId){let p=products.find(x=>x.id===editId);Object.assign(p,{name,price,active})}else products.push({id:'P'+Date.now(),name,price,active,createdAt:Date.now()});save();toast('Producto guardado');go('products')}
function customersPage(){let a=customers.slice().sort((a,b)=>a.name.localeCompare(b.name));$('view').innerHTML=bar('Clientes',`<button onclick="openCustomerForm()">＋</button>`)+`<div class="page"><div class="sectionCard"><div class="sectionHead"><h2>Clientes</h2><div class="count">${customers.length} registrados</div></div><div class="search"><span>⌕</span><input id="cq" placeholder="Buscar nombre o teléfono" oninput="filterCustomers()"></div><div id="customerList">${a.map(customerRow).join('')||'<div style="padding:20px;text-align:center;color:#819793">No hay clientes registrados.</div>'}</div></div><button class="glowBtn" onclick="openCustomerForm()">＋ AGREGAR CLIENTE</button></div>`}
function customerRow(c){return `<div class="listItem" onclick="customerDetail('${c.id}')"><div><b>${esc(c.name)}</b><small>${esc(c.phone||'Sin teléfono')}</small></div><span style="color:#55dec0">›</span></div>`}function filterCustomers(){let q=($('cq')?.value||'').toLowerCase();$('customerList').innerHTML=customers.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(q)).map(customerRow).join('')||'<div style="padding:20px;text-align:center;color:#819793">No se encontraron clientes.</div>'}
function customerDetail(id){let c=customers.find(x=>x.id===id);if(!c)return;page='customerDetail';$('hero').classList.add('hidden');nav();let cs=sales.filter(s=>(s.customer||'')===c.name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));let debt=customerDebt(c.name);let phone=(c.phone||'').replace(/\D/g,'');let wa=phone?(phone.length===8?'506'+phone:phone):'';$('view').innerHTML=bar('Cliente',`<button onclick="openCustomerForm('${c.id}')">EDITAR</button>`)+`<div class="page"><div class="panel formCard"><div style="text-align:center;font-size:42px;margin:5px 0 8px">👤</div><h2 style="text-align:center;margin:0;font-size:22px">${esc(c.name)}</h2><div style="text-align:center;color:#8da7a2;font-size:12px;margin-top:5px">${esc(c.phone||'Sin teléfono')}</div><div class="recordActions" style="margin-top:15px">${wa?`<button class="tinyBtn" style="color:#75e7a9;border-color:#28704f" onclick="window.location.href='https://wa.me/${wa}'">💬 WHATSAPP</button>`:''}${c.phone?`<button class="tinyBtn" onclick="window.location.href='tel:${esc(c.phone)}'">📞 LLAMAR</button>`:''}</div><div class="summaryBar"><div class="summaryCell"><b>${colones(cs.reduce((x,s)=>x+(+s.total||0),0))}</b><small>Total comprado</small></div><div class="summaryCell"><b>${colones(debt)}</b><small>Saldo pendiente</small></div></div><button class="glowBtn" onclick="customerSalesPage('${esc(c.name).replace(/'/g,"\\'")}')">💳 VER VENTAS Y ABONOS</button><button class="secondaryBtn" onclick="openCustomerForm('${c.id}')">✏️ EDITAR DATOS</button></div><div class="sectionHead"><h2>Últimas ventas</h2><div class="count">${cs.length}</div></div>${cs.slice(0,5).map(s=>`<div class="panel recordCard"><div class="recordTop"><div><div class="name">${fmt(s.date)}</div><div class="recordMeta">${(s.items||[]).map(i=>esc(i.name)).join(' · ')}</div></div><div class="recordAmount">${colones(s.total)}</div></div></div>`).join('')||'<div class="panel" style="padding:20px;text-align:center;color:#819793">Este cliente todavía no tiene ventas.</div>'}</div>`} 

function openCustomerForm(id){page='customerForm';$('hero').classList.add('hidden');nav();editId=id||null;let c=id?customers.find(x=>x.id===id):null;$('view').innerHTML=bar(c?'Editar cliente':'Agregar cliente',`<button onclick="saveCustomer()">GUARDAR</button>`)+`<div class="page"><div class="panel formCard"><div class="formLabel">Nombre</div><input id="custName" class="input" value="${esc(c?.name||'')}" placeholder="Ej. María López"><div class="formLabel">Teléfono / WhatsApp</div><input id="custPhone" class="input" value="${esc(c?.phone||'')}" placeholder="8888-8888"><div class="formLabel">Notas</div><textarea id="custNotes" class="input" rows="3" placeholder="Preferencias o detalles">${esc(c?.notes||'')}</textarea><button class="glowBtn" onclick="saveCustomer()">GUARDAR CLIENTE</button><button class="dangerBtn" onclick="deleteCustomer('${id||''}')">ELIMINAR CLIENTE</button></div></div>`}
function saveCustomer(){let name=$('custName').value.trim(),phone=$('custPhone').value.trim(),notes=$('custNotes').value.trim();if(!name)return toast('Escribe el nombre');if(editId){let c=customers.find(x=>x.id===editId);Object.assign(c,{name,phone,notes})}else customers.push({id:'C'+Date.now(),name,phone,notes,createdAt:Date.now()});save();toast('Cliente guardado');go('customers')}
function deleteCustomer(id){if(!id)return;if(!confirm('¿Eliminar este cliente?'))return;customers=customers.filter(c=>c.id!==id);save();toast('Cliente eliminado');go('customers')}
function expensesPage(date=todayIso()){let a=expenses.filter(e=>e.date===date).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0)),total=expensesForDate(date);$('view').innerHTML=bar('Gastos',`<button onclick="openExpenseForm()">＋</button>`)+`<div class="page"><div class="panel formCard"><div class="formLabel">Fecha</div><input class="input" type="date" value="${date}" onchange="expensesPage(this.value)"><div class="summaryBar"><div class="summaryCell"><b>${colones(total)}</b><small>Gastos del día</small></div><div class="summaryCell"><b>${colones(salesForDate(date)-total)}</b><small>Ganancia estimada</small></div></div><button class="glowBtn" onclick="openExpenseForm(null,'${date}')">＋ REGISTRAR GASTO</button></div><div class="sectionHead"><h2>Detalle</h2><div class="count">${a.length} registros</div></div>${a.map(e=>`<div class="panel recordCard"><div class="recordTop"><div><div class="name">${esc(e.description)}</div><div class="recordMeta">${esc(e.category||'Sin categoría')}</div></div><div class="recordAmount">${colones(e.amount)}</div></div><div class="recordActions"><button class="tinyBtn" onclick="openExpenseForm('${e.id}')">EDITAR</button><button class="tinyBtn red" onclick="deleteExpense('${e.id}')">ELIMINAR</button></div></div>`).join('')||'<div class="panel" style="padding:22px;text-align:center;color:#819793">No hay gastos registrados.</div>'}</div>`}
function openExpenseForm(id,date=todayIso()){page='expenseForm';$('hero').classList.add('hidden');nav();editExpenseId=id||null;let e=id?expenses.find(x=>x.id===id):null;$('view').innerHTML=bar(e?'Editar gasto':'Registrar gasto',`<button onclick="saveExpense()">GUARDAR</button>`)+`<div class="page"><div class="panel formCard"><div class="formLabel">Fecha</div><input id="exDate" type="date" class="input" value="${e?.date||date}"><div class="formLabel">Descripción</div><input id="exDesc" class="input" value="${esc(e?.description||'')}" placeholder="Ej. Compra de vegetales"><div class="formLabel">Categoría</div><input id="exCat" class="input" value="${esc(e?.category||'')}" placeholder="Ej. Ingredientes"><div class="formLabel">Monto</div><input id="exAmount" class="input" type="number" min="0" inputmode="numeric" value="${esc(e?.amount||'')}"><button class="glowBtn" onclick="saveExpense()">GUARDAR GASTO</button><button class="secondaryBtn" onclick="go('expenses')">CANCELAR</button></div></div>`}
function saveExpense(){let date=$('exDate').value,description=$('exDesc').value.trim(),category=$('exCat').value.trim(),amount=+$('exAmount').value||0;if(!date||!description||amount<=0)return toast('Completa los datos del gasto');let obj={date,description,category,amount,updatedAt:Date.now()};if(editExpenseId){let e=expenses.find(x=>x.id===editExpenseId);Object.assign(e,obj)}else expenses.push({id:'E'+Date.now(),...obj,createdAt:Date.now()});save();toast('Gasto guardado');expensesPage(date)}function deleteExpense(id){if(!confirm('¿Eliminar este gasto?'))return;expenses=expenses.filter(e=>e.id!==id);save();toast('Gasto eliminado');expensesPage()}
function productionPage(date=todayIso()){let a=production.filter(x=>x.date===date).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));let total=a.reduce((n,x)=>n+(+x.qty||0),0);$('view').innerHTML=bar('Producción',`<button onclick="openProductionForm(null,'${date}')">＋</button>`)+`<div class="page"><div class="panel formCard"><div class="formLabel">Fecha</div><input class="input" type="date" value="${date}" onchange="productionPage(this.value)"><div class="summaryBar"><div class="summaryCell"><b>${total}</b><small>Unidades hechas hoy</small></div><div class="summaryCell"><b>${a.length}</b><small>Productos registrados</small></div></div><button class="glowBtn" onclick="openProductionForm(null,'${date}')">＋ REGISTRAR PRODUCCIÓN</button></div><div class="sectionHead"><h2>Lo que hice este día</h2><div class="count">${a.length} registros</div></div>${a.map(x=>`<div class="panel recordCard"><div class="recordTop"><div><div class="name">${esc(x.productName)}</div><div class="recordMeta">${fmt(x.date)}${x.note?' · '+esc(x.note):''}</div></div><div class="recordAmount">${x.qty} uds.</div></div><div class="recordActions"><button class="tinyBtn" onclick="openProductionForm('${x.id}')">EDITAR</button><button class="tinyBtn red" onclick="deleteProduction('${x.id}')">ELIMINAR</button></div></div>`).join('')||'<div class="panel" style="padding:22px;text-align:center;color:#819793">No hay producción registrada para este día.</div>'}</div>`}
function openProductionForm(id,date=todayIso()){window._editProductionId=id||null;let x=id?production.find(z=>z.id===id):null;$('view').innerHTML=bar(x?'Editar producción':'Registrar producción',`<button onclick="saveProduction()">GUARDAR</button>`)+`<div class="page"><div class="panel formCard"><div class="formLabel">Fecha</div><input id="prDate" type="date" class="input" value="${x?.date||date}"><div class="formLabel">Producto</div><select id="prProduct" class="input">${products.filter(p=>p.active!==false).map(p=>`<option value="${p.id}" ${x?.productId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')||'<option value="">Primero agrega productos</option>'}</select><div class="formLabel">Cantidad preparada</div><input id="prQty" class="input" type="number" min="1" inputmode="numeric" value="${x?.qty||''}" placeholder="Ej. 10"><div class="formLabel">Nota (opcional)</div><input id="prNote" class="input" value="${esc(x?.note||'')}" placeholder="Ej. Preparados para mañana"><button class="glowBtn" onclick="saveProduction()">GUARDAR PRODUCCIÓN</button><button class="secondaryBtn" onclick="go('production')">CANCELAR</button></div></div>`}
function saveProduction(){let date=$('prDate').value,pid=$('prProduct').value,qty=+$('prQty').value||0,note=$('prNote').value.trim(),p=products.find(x=>x.id===pid);if(!date||!p||qty<=0)return toast('Completa producto y cantidad');if(window._editProductionId){let x=production.find(z=>z.id===window._editProductionId);if(x)Object.assign(x,{date,productId:pid,productName:p.name,qty,note,updatedAt:Date.now()})}else production.push({id:'PR'+Date.now(),date,productId:pid,productName:p.name,qty,note,createdAt:Date.now()});window._editProductionId=null;save();toast('Producción guardada');productionPage(date)}
function deleteProduction(id){if(!confirm('¿Eliminar este registro de producción?'))return;production=production.filter(x=>x.id!==id);save();toast('Registro eliminado');productionPage()}
function settingsPage(){$('view').innerHTML=`<div class="page"><div class="settingsLogo">🍽️ VENTAS<span style="color:#fff">PRO</span></div><div class="panel"><div class="setting" onclick="go('backup')"><div class="sicon">💾</div><div><b>Respaldo de datos</b><small>Importar o exportar una copia</small></div></div><div class="setting" onclick="securityPage()"><div class="sicon">🔒</div><div><b>Seguridad</b><small>Cambiar contraseña</small></div></div><div class="setting" onclick="logoutToLogin()"><div class="sicon">↪</div><div><b>Cerrar sesión</b><small>Volver al acceso</small></div></div></div><button class="dangerBtn" onclick="askExit()">SALIR DE LA APLICACIÓN</button></div>`}
function backupPage(){$('view').innerHTML=bar('Respaldo de datos')+`<div class="page"><div class="panel formCard" style="text-align:center"><div style="font-size:48px;margin:6px 0 12px">💾</div><h2 style="margin:0 0 8px">Copias de seguridad</h2><p style="color:#9bb0ad;line-height:1.5">Guarde una copia de todos sus datos para poder recuperarlos si cambia de teléfono o necesita restaurarlos.</p><button class="glowBtn" onclick="exportBackup()">⬇️ EXPORTAR RESPALDO</button><button class="secondaryBtn" onclick="importBackup()">⬆️ IMPORTAR RESPALDO</button><div class="simpleHint">Incluye ventas, productos, clientes, gastos, abonos y producción.</div></div></div>`}
function securityPage(){page='security';$('hero').classList.add('hidden');nav();$('view').innerHTML=bar('Seguridad',`<button onclick="go('settings')">CERRAR</button>`)+`<div class="page"><div class="panel formCard"><div style="color:#4ee0c0;font-weight:900;font-size:12px">🔒 Cambiar contraseña</div><div class="formLabel">Contraseña actual</div><input id="oldPass" class="input" type="password"><div class="formLabel">Nueva contraseña</div><input id="newPass" class="input" type="password"><div class="formLabel">Repetir nueva contraseña</div><input id="newPass2" class="input" type="password"><button class="glowBtn" onclick="changePassword()">ACTUALIZAR CONTRASEÑA</button><div class="securityNote">La contraseña se guarda únicamente en este teléfono.</div></div></div>`}
function changePassword(){const oldP=$('oldPass').value,newP=$('newPass').value,newP2=$('newPass2').value;if(newP.length<4)return toast('Usa al menos 4 caracteres');if(newP!==newP2)return toast('Las contraseñas no coinciden');let ok=false;try{ok=window.Android?.changePassword?Android.changePassword(oldP,newP):false}catch(e){}if(!ok)return toast('La contraseña actual no es correcta');toast('Contraseña actualizada');setTimeout(()=>go('settings'),900)}
function exportBackup(){let raw=JSON.stringify({app:'VentasProComida',version:3,exportedAt:new Date().toISOString(),products,sales,expenses,customers,abonos,production},null,2);if(window.Android?.exportBackup){window.Android.exportBackup(raw);toast('Respaldo enviado para guardar')}else{let blob=new Blob([raw],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Respaldo-VentasPro-'+todayIso()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Respaldo descargado')}}
function importBackup(){if(window.Android?.importBackup){window.Android.importBackup();return}let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let f=input.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>window.importBackupFromAndroid(r.result);r.readAsText(f)};input.click()}
window.importBackupFromAndroid=function(raw){try{let o=JSON.parse(raw);if(!o||(!Array.isArray(o.sales)&&!Array.isArray(o.products)))throw 0;if(Array.isArray(o.products))products=o.products;if(Array.isArray(o.sales))sales=o.sales;if(Array.isArray(o.expenses))expenses=o.expenses;if(Array.isArray(o.customers))customers=o.customers;if(Array.isArray(o.abonos))abonos=o.abonos;if(Array.isArray(o.production))production=o.production;save();toast('Respaldo restaurado');go('home')}catch(e){toast('Respaldo no válido')}}
function render(){({home,sales:salesPage,products:productsPage,customers:customersPage,expenses:expensesPage,production:productionPage,abonos:abonosPage,settings:settingsPage,backup:backupPage,summary:summaryPage}[page]||home)()}document.body.dataset.page='login';save();$('loginPass').focus();
</script>
</body>
</html>
