.hero:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,#0000 0,#0000 58%,#00060b 100%);
}
.heroGlow{
  position:absolute;left:12px;right:12px;bottom:10px;z-index:2;
  padding:14px 16px;border:1px solid #19baff;border-radius:18px;
  background:linear-gradient(135deg,#05101ccc,#0a2741dd);
  box-shadow:0 0 10px #0ca7ff,0 0 28px #0ca7ff55,inset 0 0 24px #0ca7ff22;
}
.heroGlow .eyebrow{color:#23c7ff;font-weight:950;font-size:12px;letter-spacing:1.1px}
.heroGlow h1{font-size:28px;line-height:1.02;margin:4px 0 7px}
.heroGlow p{font-size:12px;color:#d5ecfb;margin:0;max-width:70%}
.page{padding:13px 14px 20px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.metric{
  min-height:105px;padding:10px 7px;border:1px solid #17425c;border-radius:14px;
  background:linear-gradient(180deg,#07131e,#050c13);
  text-align:center;box-shadow:0 8px 20px #0007
}
.metric .icon{
  width:39px;height:39px;margin:0 auto 5px;border-radius:12px;display:grid;place-items:center;
  color:#52d9ff;font-size:22px;border:1px solid #17baff;
  background:radial-gradient(circle,#0e6da544,#061018);
  box-shadow:0 0 10px #0db8ff,0 0 20px #0db8ff55;
}
.metric b{display:block;font-size:21px;margin:2px 0 1px}
.metric small{font-size:9px;color:#859aab;line-height:1.2}
.sectionCard{
  margin-top:11px;border:1px solid #17384f;border-radius:14px;background:linear-gradient(180deg,#06111a,#040b11);
  box-shadow:0 10px 24px #0008;
}
.sectionHead{display:flex;justify-content:space-between;align-items:center;padding:12px 13px 8px}
.sectionHead h2{margin:0;font-size:18px}
.sectionHead .count{color:#27c6ff;font-size:11px;font-weight:900}
.search{position:relative;padding:0 12px 11px}
.search span{position:absolute;left:25px;top:11px;color:#7690a4}
.search input{width:100%;padding:11px 11px 11px 38px;border-radius:10px;border:1px solid #24425a;background:#06101a;color:#dcecf7;outline:none}
.search input:focus{border-color:#0eb4ff;box-shadow:0 0 0 2px #0eb4ff22}
.clientList{padding:0 10px 10px}
.client{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:11px 10px;margin-top:7px;border:1px solid #16384e;border-radius:10px;
  background:linear-gradient(180deg,#08141e,#050d14)
}
.client .name{font-size:13px;font-weight:900}
.plate{display:inline-block;margin-top:4px;padding:2px 6px;border-radius:5px;border:1px solid #0eb3ff;color:#45ceff;font-size:10px;font-weight:900}
.phone{font-size:10px;color:#a6bccb;margin-top:4px}
.whatsapp{color:#42e889;font-weight:900}
.next{text-align:right}
.next small{display:block;color:#7f97aa;font-size:9px}
.next .date{color:#24bfff;font-size:13px;font-weight:950}
.next .period{color:#4db8e4;font-size:9px;margin-top:2px}
.glowBtn{
  width:100%;margin-top:12px;padding:13px;border:1px solid #3cc9ff;border-radius:10px;
  background:linear-gradient(180deg,#078bdc,#07569a);color:#fff;font-weight:950;
  box-shadow:0 0 10px #11b6ff,0 0 25px #11b6ff55,inset 0 0 18px #52d9ff22;
}
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:720px;margin:auto;
  min-height:92px;padding:7px 5px calc(18px + var(--safe));
  display:grid;grid-template-columns:repeat(4,1fr);
  background:#03101af5;border-top:1px solid #17394f;backdrop-filter:blur(18px);
  box-shadow:0 -8px 25px #000b
}
.nav button{border:0;background:transparent;color:#768a9b;min-height:58px;font-size:10px;font-weight:750}
.nav button.active{color:#20c0ff}
.nav .navIcon{display:block;font-size:23px;line-height:1;margin-bottom:4px}
.titlebar{
  position:sticky;top:0;z-index:30;height:58px;display:grid;grid-template-columns:52px 1fr 78px;align-items:center;
  padding:0 8px;background:#01080df7;border-bottom:1px solid #122f43;backdrop-filter:blur(14px)
}
.titlebar h2{font-size:16px;text-align:center;margin:0}
.titlebar button{border:0;background:transparent;color:#42caff;font-weight:850}
.back{font-size:26px;text-align:left}
.formCard,.panel{border:1px solid #17384f;border-radius:12px;background:linear-gradient(180deg,#07121b,#050c12);box-shadow:0 10px 24px #0008}
.formCard{padding:12px}
.formLabel{font-size:10px;color:#a9c3d4;font-weight:850;margin:9px 0 5px}
.input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #1c3a50;background:#050d14;color:#eef7fd;outline:none}
.input:focus{border-color:#0eb5ff;box-shadow:0 0 0 2px #0eb5ff22}
.periodCard{padding:12px;margin-top:10px}
.periodCard h3{font-size:13px;margin:0 0 10px}
.periodGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.periodBtn{padding:11px 4px;border-radius:8px;border:1px solid #173b53;background:#06121b;color:#d6e8f3;font-size:10px;font-weight:850}
.periodBtn.sel{border-color:#43d2ff;background:linear-gradient(#0a8fdf,#075a9a);box-shadow:0 0 10px #0eb4ff,0 0 22px #0eb4ff66}
.customBtn{width:100%;margin-top:8px;padding:11px;border:1px solid #18394f;border-radius:8px;background:#07131d;color:#dce9f2;text-align:left}
.custom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.estimate{padding:12px;margin-top:10px}
.estimate small{color:#3ec9ff;font-size:10px;font-weight:850}
.estimate strong{display:block;color:#25c2ff;font-size:20px;margin:4px 0}
.estimate em{font-style:normal;color:#839cad;font-size:10px}
.detailTop{display:flex;align-items:center;gap:12px;padding:13px}
.avatar{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#35c4ff;font-size:23px;font-weight:950;border:2px solid #1db9ff;background:#071620;box-shadow:0 0 15px #0bb7ff,0 0 28px #0bb7ff55,inset 0 0 18px #0bb7ff22}
.detailTop h2{font-size:18px;margin:0 0 4px}
.infoBox{padding:12px;margin-top:9px}
.infoBox h3{color:#29c1ff;font-size:12px;margin:0 0 7px}
.infoRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #102b3b;font-size:10px}
.infoRow:last-child{border-bottom:0}
.infoRow span:first-child{color:#7f97aa}
.dangerBtn{width:100%;padding:12px;margin-top:10px;border-radius:9px;border:1px solid #e02c37;background:#12070a;color:#ff4650;font-weight:950}
.reminder{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:11px;margin-top:7px}
.reminder b{font-size:12px}
.badge{padding:3px 10px;border-radius:999px;font-size:9px;font-weight:900}
.redB{color:#ff5660;border:1px solid #7e2930}.amberB{color:#ffc04b;border:1px solid #775b20}.blueB{color:#47caff;border:1px solid #1d6087}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #16364d}
.tabs button{padding:10px 4px;background:transparent;border:0;color:#758c9d;font-size:10px}
.tabs button.active{color:#fff;border-bottom:2px solid #18b7ff}
.settingsLogo{text-align:center;padding:15px 0 10px;font-weight:950;font-size:26px;letter-spacing:.5px}
.settingsLogo span{color:#27c2ff}
.setting{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #102b3b}
.setting:last-child{border-bottom:0}
.setting .sicon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#0b1b27;color:#8ec2de}
.setting b{font-size:12px}.setting small{display:block;color:#8197a8;font-size:9px}
.modalBg{position:fixed;inset:0;z-index:100;background:#000c;display:grid;place-items:center;padding:18px}
.modal{max-width:370px;width:100%;padding:22px;border-radius:13px;border:1px solid #d73540;background:#08090b;text-align:center}
.trash{width:62px;height:62px;margin:auto;border-radius:50%;display:grid;place-items:center;border:1px solid #ff3f4a;color:#ff3f4a;font-size:27px}
.modal h2{color:#ff404a}.modal p{font-size:12px;line-height:1.5}
.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cancel,.delete{padding:11px;border:0;border-radius:8px;font-weight:900}.cancel{background:#1a1a1d;color:#fff}.delete{background:#da2630;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(115px + var(--safe));transform:translateX(-50%);z-index:120;background:#07263a;border:1px solid #2474a2;padding:10px 14px;border-radius:8px;font-size:12px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div id="hero" class="hero">
    <div class="heroGlow">
      <div class="eyebrow">GESTIÓN PREMIUM</div>
      <h1>Acabado cerámico<br>bajo control</h1>
      <p>Recordatorios personalizados y contacto inmediato con tus clientes.</p>
    </div>
  </div>
  <main id="view"></main>
  <nav class="nav">
    <button data-p="home" onclick="go('home')"><span class="navIcon">⌂</span>Inicio</button>
    <button data-p="clients" onclick="go('clients')"><span class="navIcon">♙</span>Clientes</button>
    <button data-p="reminders" onclick="go('reminders')"><span class="navIcon">♢</span>Recordatorios</button>
    <button data-p="settings" onclick="go('settings')"><span class="navIcon">•••</span>Más</button>
  </nav>
</div>
<div id="toast" class="toast hidden"></div>
<div id="modal" class="hidden"></div>
<script>
const KEY='cm_ceramico_clients_v1';
let clients=JSON.parse(localStorage.getItem(KEY)||'[]').map(c=>({...c,periodMonths:c.periodMonths??2,periodDays:c.periodDays??15}));
let page='home',editId=null,period={m:2,d:15};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(clients));window.Android?.syncData?.(JSON.stringify(clients))}
function calc(iso,m,d){let[y,mo,da]=iso.split('-').map(Number),x=new Date(y,mo-1,da),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+m);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}
function fmt(i){if(!i)return'—';let[y,m,d]=i.split('-');return `${d}/${m}/${y}`}
function diff(i){let t=new Date();t.setHours(0,0,0,0);let[y,m,d]=i.split('-').map(Number);return Math.round((new Date(y,m-1,d)-t)/86400000)}
function label(c){let m=c.periodMonths||0,d=c.periodDays||0;return `${m?m+' mes'+(m==1?'':'es'):''}${m&&d?' + ':''}${d?d+' día'+(d==1?'':'s'):''}`}
function initials(n){return n.split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function toast(m){let t=$('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2000)}
function nav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page))}
function go(p){page=p;editId=null;$('hero').classList.toggle('hidden',!(p==='home'));render();nav();scrollTo(0,0)}
function ordered(){return clients.slice().sort((a,b)=>a.renewalDate.localeCompare(b.renewalDate))}
function row(c){return `<div class="client" onclick="detail('${c.id}')"><div><div class="name">${esc(c.name)}</div><span class="plate">${esc(c.plate)}</span><div class="phone"><span class="whatsapp">●</span> ${esc(c.phone)}</div></div><div class="next"><small>Próximo recordatorio</small><div class="date">${fmt(c.renewalDate)}</div><div class="period">${label(c)}</div></div></div>`}
function home(){
  let next15=clients.filter(c=>!c.completed&&diff(c.renewalDate)>=0&&diff(c.renewalDate)<=15).length;
  let today=clients.filter(c=>!c.completed&&diff(c.renewalDate)===0).length;
  $('view').innerHTML=`<div class="page">
    <div class="metrics">
      <div class="metric"><div class="icon">♙</div><b>${clients.length}</b><small>Clientes</small></div>
      <div class="metric"><div class="icon">▣</div><b>${next15}</b><small>Próximos 15 días</small></div>
      <div class="metric"><div class="icon">✓</div><b>${today}</b><small>Corresponden hoy</small></div>
      <div class="metric"><div class="icon">⚙</div><b>Flexible</b><small>Periodo por cliente</small></div>
    </div>
    <div class="sectionCard">
      <div class="sectionHead"><h2>Clientes</h2><div class="count">${clients.length} registrados</div></div>
      <div class="search"><span>⌕</span><input id="q" placeholder="Buscar nombre, placa o teléfono..." oninput="homeFilter()"></div>
      <div id="homeList" class="clientList">${ordered().slice(0,4).map(row).join('')||'<div style="padding:20px;text-align:center;color:#7d94a5">No hay clientes registrados.</div>'}</div>
    </div>
    <button class="glowBtn" onclick="form()">＋ AGREGAR CLIENTE</button>
  </div>`
}
function homeFilter(){let q=$('q').value.toLowerCase(),a=ordered().filter(c=>[c.name,c.plate,c.phone].join(' ').toLowerCase().includes(q));$('homeList').innerHTML=a.map(row).join('')||'<div style="padding:20px;text-align:center;color:#7d94a5">No se encontraron clientes.</div>'}
function clientsPage(){$('view').innerHTML=`<div class="page"><div class="sectionCard"><div class="sectionHead"><h2>Clientes</h2><div class="count">${clients.length} registrados</div></div><div class="search"><span>⌕</span><input id="q" placeholder="Buscar nombre, placa o teléfono..." oninput="filterClients()"></div><div id="clientList" class="clientList"></div></div><button class="glowBtn" onclick="form()">＋ AGREGAR CLIENTE</button></div>`;filterClients()}
function filterClients(){let q=($('q')?.value||'').toLowerCase(),a=ordered().filter(c=>[c.name,c.plate,c.phone].join(' ').toLowerCase().includes(q));$('clientList').innerHTML=a.map(row).join('')||'<div style="padding:20px;text-align:center;color:#7d94a5">No se encontraron clientes.</div>'}
function bar(title,right=''){return `<div class="titlebar"><button class="back" onclick="go('clients')">‹</button><h2>${title}</h2><div>${right}</div></div>`}
function form(id){
  editId=id||null; let c=id?clients.find(x=>x.id===id):null; let d=c?.serviceDate||new Date().toISOString().slice(0,10);
  period={m:c?.periodMonths??2,d:c?.periodDays??15}; $('hero').classList.add('hidden');
  $('view').innerHTML=bar(c?'Editar cliente':'Agregar cliente',`<button onclick="saveClient()">▣ GUARDAR</button>`)+`<div class="page">
    <div class="formCard">
      <div style="color:#42caff;font-weight:900;font-size:12px">♙ Información del cliente</div>
      <div class="formLabel">Nombre completo</div><input id="name" class="input" value="${esc(c?.name||'')}" placeholder="Ej. Juan Carlos Rodríguez">
      <div class="formLabel">Placa</div><input id="plate" class="input" value="${esc(c?.plate||'')}" placeholder="Ej. BCD-123">
      <div class="formLabel">Teléfono / WhatsApp</div><input id="phone" class="input" value="${esc(c?.phone||'')}" placeholder="Ej. 8888-8888">
      <div class="formLabel">Fecha del servicio</div><input id="date" class="input" type="date" value="${d}" onchange="preview()">
    </div>
    <div class="periodCard panel">
      <h3>Periodo de recordatorio ⓘ</h3>
      <div class="periodGrid">
        <button class="periodBtn ${period.m==2&&period.d==15?'sel':''}" onclick="setPeriod(2,15,this)">2 meses<br>+15 días</button>
        <button class="periodBtn ${period.m==3&&period.d==0?'sel':''}" onclick="setPeriod(3,0,this)">3<br>meses</button>
        <button class="periodBtn ${period.m==4&&period.d==0?'sel':''}" onclick="setPeriod(4,0,this)">4<br>meses</button>
        <button class="periodBtn ${period.m==6&&period.d==0?'sel':''}" onclick="setPeriod(6,0,this)">6<br>meses</button>
      </div>
      <button class="customBtn" onclick="setPeriod(-1,0,this)">▣ Personalizado<br><span style="font-size:9px;color:#7d94a5">Elegir meses y días</span></button>
      <div id="customBox" class="custom hidden"><input id="cm" class="input" type="number" min="0" placeholder="Meses" oninput="customPeriod()"><input id="cd" class="input" type="number" min="0" placeholder="Días" oninput="customPeriod()"></div>
    </div>
    <div class="estimate panel"><small>Próximo recordatorio estimado</small><strong id="renew">${fmt(calc(d,period.m,period.d))}</strong><em id="periodLabel">${label({periodMonths:period.m,periodDays:period.d})}</em></div>
    <div class="formLabel">Notas (opcional)</div><textarea id="notes" class="input" rows="3" placeholder="Cualquier detalle adicional...">${esc(c?.notes||'')}</textarea>
    <button class="glowBtn" onclick="saveClient()">GUARDAR CLIENTE</button>
  </div>`
}
function setPeriod(m,d,el){period={m,d};document.querySelectorAll('.periodBtn').forEach(x=>x.classList.remove('sel'));if(el?.classList.contains('periodBtn'))el.classList.add('sel');$('customBox').classList.toggle('hidden',m>=0);preview()}
function customPeriod(){period={m:-1,d:0};preview()}
function preview(){let v=$('date')?.value;if(!v)return;let m=period.m<0?(+$('cm')?.value||0):period.m,d=period.m<0?(+$('cd')?.value||0):period.d;$('renew').textContent=fmt(calc(v,m,d));$('periodLabel').textContent=label({periodMonths:m,periodDays:d})}
function saveClient(){
  let name=$('name').value.trim(),plate=$('plate').value.trim().toUpperCase(),phone=$('phone').value.trim(),serviceDate=$('date').value,notes=$('notes').value.trim();
  if(!name||!plate||!phone||!serviceDate)return toast('Completa los campos obligatorios');
  let pm=period.m<0?(+$('cm').value||0):period.m,pd=period.m<0?(+$('cd').value||0):period.d;
  if(pm===0&&pd===0)return toast('El periodo no puede ser cero');
  let renewalDate=calc(serviceDate,pm,pd);
  if(editId){let c=clients.find(x=>x.id===editId);window.Android?.cancelReminder?.(c.id);Object.assign(c,{name,plate,phone,serviceDate,renewalDate,periodMonths:pm,periodDays:pd,notes,completed:false});window.Android?.scheduleReminder?.(c.id,name,plate,renewalDate)}
  else{let c={id:String(Date.now()),name,plate,phone,serviceDate,renewalDate,periodMonths:pm,periodDays:pd,notes,completed:false};clients.push(c);window.Android?.scheduleReminder?.(c.id,name,plate,renewalDate)}
  save();toast('Cliente guardado');go('clients')
}
function detail(id){
  let c=clients.find(x=>x.id===id); page='detail'; $('hero').classList.add('hidden'); nav();
  $('view').innerHTML=bar('Detalle del cliente',`<button onclick="form('${c.id}')">✎</button>`)+`<div class="page">
    <div class="panel detailTop"><div class="avatar">${initials(c.name)}</div><div><h2>${esc(c.name)}</h2><span class="plate">${esc(c.plate)}</span><div class="phone"><span class="whatsapp">●</span> ${esc(c.phone)}</div></div></div>
    <div class="panel estimate"><small>Próximo recordatorio</small><strong>${fmt(c.renewalDate)}</strong><em>${label(c)}</em></div>
    <div class="panel infoBox"><h3>Información</h3><div class="infoRow"><span>Fecha del servicio</span><span>${fmt(c.serviceDate)}</span></div><div class="infoRow"><span>Periodo seleccionado</span><span>${label(c)}</span></div><div class="infoRow"><span>Servicio</span><span>Acabado cerámico</span></div><div class="infoRow"><span>Notas</span><span>${esc(c.notes||'—')}</span></div></div>
    <button class="glowBtn" onclick="wa('${c.id}')">WhatsApp · contactar cliente</button>
    <button class="dangerBtn" onclick="confirmDelete('${c.id}')">🗑 ELIMINAR CLIENTE</button>
  </div>`
}
function confirmDelete(id){let c=clients.find(x=>x.id===id);$('modal').className='modalBg';$('modal').innerHTML=`<div class="modal"><div class="trash">🗑</div><h2>Eliminar cliente</h2><p>¿Seguro que deseas eliminar a<br><b>${esc(c.name)}</b>?<br>Esta acción no se puede deshacer.</p><div class="modalBtns"><button class="cancel" onclick="closeModal()">CANCELAR</button><button class="delete" onclick="removeClient('${id}')">ELIMINAR</button></div></div>`}
function closeModal(){$('modal').className='hidden';$('modal').innerHTML=''}
function removeClient(id){window.Android?.cancelReminder?.(id);clients=clients.filter(x=>x.id!==id);save();closeModal();toast('Cliente eliminado');go('clients')}
function remindersPage(){
  let a=ordered().filter(c=>!c.completed);
  $('view').innerHTML=`<div class="titlebar"><div></div><h2>♢ Recordatorios</h2><div style="color:#31c8ff;font-size:10px;font-weight:900">${a.length} pendientes</div></div>
  <div class="tabs"><button class="active">Pendientes</button><button>Hoy</button><button>Próximos</button><button>Todos</button></div>
  <div class="page">${a.map(c=>{let n=diff(c.renewalDate),cl=n<=2?'redB':n<=15?'amberB':'blueB';return `<div class="panel reminder" onclick="detail('${c.id}')"><div><b>${esc(c.name)}</b><div class="plate">${esc(c.plate)}</div><div class="date" style="font-size:11px;color:#88a2b4">${fmt(c.renewalDate)}</div></div><div><span class="badge ${cl}">${n<0?Math.abs(n)+' días vencido':n+' días'}</span><span class="whatsapp" style="margin-left:8px" onclick="event.stopPropagation();wa('${c.id}')">●</span></div></div>`}).join('')||'<div class="panel" style="padding:22px;text-align:center;color:#7890a5">No hay recordatorios pendientes.</div>'}</div>`
}
function settingsPage(){$('view').innerHTML=`<div class="page"><div class="settingsLogo">CARWASH<span>MIAMI</span></div><div class="panel"><div class="setting" onclick="exportBackup()"><div class="sicon">☁</div><div><b>Respaldo de datos</b><small>Guardar copia de seguridad</small></div></div><div class="setting" onclick="window.Android?.importBackup?.()"><div class="sicon">↶</div><div><b>Restaurar datos</b><small>Recuperar copia existente</small></div></div><div class="setting"><div class="sicon">♢</div><div><b>Notificaciones</b><small>Alertas según cada cliente</small></div></div></div></div>`}
function wa(id){let c=clients.find(x=>x.id===id),msg=`Hola ${c.name} 👋 Somos de Carwash Miami. Te recordamos que corresponde revisar o renovar el acabado cerámico de tu vehículo ${c.plate}. ¿Deseas coordinar una cita?`;window.Android?.openWhatsApp?.(c.phone,msg)}
function exportBackup(){let raw=JSON.stringify({app:'Carwash Miami Cerámico',version:4,exportedAt:new Date().toISOString(),clients},null,2);window.Android?.exportBackup?.(raw)}
window.importBackupFromAndroid=function(raw){try{let o=JSON.parse(raw),a=Array.isArray(o)?o:o.clients;if(!Array.isArray(a))throw 0;clients=a.map(c=>({...c,periodMonths:c.periodMonths??2,periodDays:c.periodDays??15}));save();clients.filter(c=>!c.completed).forEach(c=>window.Android?.scheduleReminder?.(c.id,c.name,c.plate,c.renewalDate));toast('Respaldo restaurado');go('home')}catch(e){toast('Respaldo no válido')}}
function render(){({home,clients:clientsPage,reminders:remindersPage,settings:settingsPage}[page]||home)()}
save();go('home');
</script>
</body>
</html>
