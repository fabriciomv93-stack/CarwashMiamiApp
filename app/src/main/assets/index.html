<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Carwash Miami Cerámico</title>
<style>
:root{--bg:#05080d;--p:#0c141f;--p2:#101c2b;--l:#1d334a;--b:#1597ff;--b2:#55c7ff;--w:#f6fbff;--m:#8ea4b9;--g:#28d17c;--y:#ffb52e;--r:#ff5864}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#073d72 0,transparent 34%),radial-gradient(circle at -15% 35%,#06243e 0,transparent 30%),var(--bg);color:var(--w);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:86px}button,input{font:inherit}.hidden{display:none!important}
.top{padding:18px;position:sticky;top:0;z-index:20;background:#05080df2;backdrop-filter:blur(16px);border-bottom:1px solid #102033}.brand{display:flex;gap:13px;align-items:center}.mark{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#82dcff,#0e86ff 45%,#06192c 72%);box-shadow:0 0 30px #108cff66;font-weight:1000}.logo{font-weight:1000;letter-spacing:.8px;font-size:20px}.logo span{color:var(--b2)}.sub{color:var(--m);font-size:11px;letter-spacing:1.4px;text-transform:uppercase}
.page{padding:18px}.hero{padding:22px;border-radius:28px;border:1px solid #1d4062;background:linear-gradient(135deg,#0b1725,#0c3054 58%,#0a73c8);box-shadow:0 18px 45px #0009}.hero h1{margin:0;font-size:28px;line-height:1.05}.hero p{margin:8px 0 0;color:#ccecff}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.metric,.card,.client{background:linear-gradient(180deg,#101b2a,#0b131e);border:1px solid var(--l);border-radius:22px;box-shadow:0 12px 28px #0006}.metric{padding:16px}.ico{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:#0f69b944;border:1px solid #148fff88;box-shadow:0 0 22px #168fff33}.metric b{font-size:26px;display:block;margin-top:10px}.metric small,.meta{color:var(--m)}
.fab{width:100%;padding:16px;border:0;border-radius:18px;margin-top:18px;color:#fff;font-weight:900;background:linear-gradient(135deg,#21a7ff,#096de0);box-shadow:0 13px 30px #0b7dde55}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 11px}.section h2{margin:0;font-size:19px}.link{color:var(--b2);font-weight:800;font-size:13px}
.list{display:flex;flex-direction:column;gap:11px}.client{padding:15px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.avatar{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#123858,#075da4);border:1px solid #1597ff66;color:#aee2ff;font-weight:900}.name{font-weight:850}.plate{color:var(--b2);font-size:13px}.due{text-align:right;font-size:12px;font-weight:900}.yellow{color:var(--y)}.red{color:var(--r)}.green{color:var(--g)}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:720px;margin:auto;height:76px;background:#07101bee;border-top:1px solid #1b2b3d;backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(4,1fr);z-index:30}.nav button{background:none;border:0;color:#7890a8;font-size:11px}.nav .active{color:#48baff}.nav i{display:block;font-style:normal;font-size:23px;margin-bottom:3px}
.title{display:flex;justify-content:space-between;align-items:center}.back{border:0;background:#101b28;color:#fff;width:43px;height:43px;border-radius:14px}.fg{margin:0 0 14px}.fg label{display:block;color:#bdd0e1;font-size:13px;margin:0 0 7px;font-weight:700}.input{width:100%;border:1px solid #28405a;background:#09121d;color:#fff;padding:14px 15px;border-radius:15px;outline:none}.input:focus{border-color:#199bff;box-shadow:0 0 0 3px #199bff22}
.renew{padding:17px;border:1px solid #168eff;background:linear-gradient(145deg,#0a1a29,#092b48);border-radius:18px;text-align:center;margin:6px 0 16px}.renew strong{display:block;font-size:28px;margin:5px 0}.renew small{color:#9fc8e7}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.mini,.secondary,.danger,.success{padding:10px 12px;border-radius:12px;border:1px solid #24405a;background:#0d1a28;color:#dcecff;font-weight:800;font-size:12px}.danger{border-color:#6a2730;color:#ff97a0}.success{border-color:#14633f;color:#7af0b1}
.search{position:relative;margin:13px 0 16px}.search input{padding-left:42px}.search span{position:absolute;left:15px;top:13px;color:#7993aa}.empty{padding:30px 18px;text-align:center;color:var(--m);border:1px dashed #294057;border-radius:20px}.setting{padding:17px;margin-bottom:11px}.setting h3{margin:0 0 5px}.setting p{margin:0;color:var(--m);font-size:13px}.setting button{margin-top:12px}.pill{padding:6px 9px;border-radius:999px;background:#0d3558;color:#6fcaff;font-size:11px;font-weight:800}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#102238;border:1px solid #2f5b82;padding:12px 16px;border-radius:14px;z-index:99;min-width:220px;text-align:center}
</style></head><body>
<div class="app"><header class="top"><div class="brand"><div class="mark">CM</div><div><div class="logo">CARWASH <span>MIAMI</span></div><div class="sub">Acabado cerámico · Recordatorios</div></div></div></header><main id="view"></main>
<nav class="nav"><button data-p="home" onclick="go('home')"><i>⌂</i>Inicio</button><button data-p="clients" onclick="go('clients')"><i>♙</i>Clientes</button><button data-p="reminders" onclick="go('reminders')"><i>♢</i>Recordatorios</button><button data-p="settings" onclick="go('settings')"><i>•••</i>Más</button></nav></div><div id="toast" class="toast hidden"></div>
<script>
const KEY='cm_ceramico_clients_v1';let clients=JSON.parse(localStorage.getItem(KEY)||'[]'),page='home',editId=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(clients));Android?.syncData?.(JSON.stringify(clients))}
function addDate(iso){let[y,m,d]=iso.split('-').map(Number),x=new Date(y,m-1,d),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+2);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));x.setDate(x.getDate()+15);return x.toISOString().slice(0,10)}
function fmt(i){if(!i)return'—';let[y,m,d]=i.split('-');return`${d}/${m}/${y}`}function diff(i){let t=new Date();t.setHours(0,0,0,0);let[y,m,d]=i.split('-').map(Number);return Math.round((new Date(y,m-1,d)-t)/86400000)}
function due(c){if(c.completed)return['Recordado','green'];let n=diff(c.renewalDate);if(n===0)return['Hoy corresponde','red'];if(n<0)return[`Vencido hace ${Math.abs(n)} día${Math.abs(n)==1?'':'s'}`,'red'];return[`Faltan ${n} día${n==1?'':'s'}`,n<=15?'yellow':'green']}
function initials(n){return n.split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}function toast(m){let t=$('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function go(p){page=p;editId=null;render();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));scrollTo(0,0)}function ordered(){return clients.slice().sort((a,b)=>a.renewalDate.localeCompare(b.renewalDate))}
function card(c){let[t,col]=due(c);return`<div class="client"><div class="row"><div style="display:flex;gap:11px;align-items:center"><div class="avatar">${esc(initials(c.name))}</div><div><div class="name">${esc(c.name)}</div><div class="plate">${esc(c.plate)}</div><div class="meta">${esc(c.phone)}</div></div></div><div class="due ${col}">${esc(t)}<div class="meta">${fmt(c.renewalDate)}</div></div></div><div class="actions"><button class="mini" onclick="detail('${c.id}')">Ver detalle</button><button class="mini" onclick="wa('${c.id}')">WhatsApp</button>${!c.completed?`<button class="mini" onclick="complete('${c.id}')">✓ Recordado</button>`:''}</div></div>`}
function home(){let next15=clients.filter(c=>!c.completed&&diff(c.renewalDate)>=0&&diff(c.renewalDate)<=15).length,today=clients.filter(c=>!c.completed&&diff(c.renewalDate)===0).length,next=ordered().filter(c=>!c.completed).slice(0,4);$('view').innerHTML=`<div class="page"><div class="hero"><h1>Control de acabado<br>cerámico</h1><p>Clientes y renovaciones siempre bajo control.</p></div><div class="metrics"><div class="metric"><div class="ico">♙</div><b>${clients.length}</b><small>Clientes guardados</small></div><div class="metric"><div class="ico">♢</div><b>${next15}</b><small>Próximos 15 días</small></div><div class="metric"><div class="ico">✓</div><b>${today}</b><small>Corresponden hoy</small></div><div class="metric"><div class="ico">◫</div><b>2m+15d</b><small>Cálculo automático</small></div></div><button class="fab" onclick="form()">＋ NUEVO CLIENTE</button><div class="section"><h2>Próximos recordatorios</h2><span class="link" onclick="go('reminders')">Ver todos</span></div><div class="list">${next.length?next.map(card).join(''):'<div class="empty">Agrega tu primer cliente.</div>'}</div></div>`}
function clientsPage(){$('view').innerHTML=`<div class="page"><div class="title"><h1>Clientes</h1><span class="pill">${clients.length} registrados</span></div><div class="search"><span>⌕</span><input id="q" class="input" placeholder="Buscar nombre, placa o teléfono" oninput="filter()"></div><div id="list" class="list"></div><button class="fab" onclick="form()">＋ AGREGAR CLIENTE</button></div>`;filter()}
function filter(){let q=($('q')?.value||'').toLowerCase(),a=ordered().filter(c=>[c.name,c.phone,c.plate].join(' ').toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(card).join(''):'<div class="empty">No se encontraron clientes.</div>'}
function remindersPage(){let a=ordered().filter(c=>!c.completed);$('view').innerHTML=`<div class="page"><div class="title"><h1>Recordatorios</h1><span class="pill">${a.length} pendientes</span></div><div class="list" style="margin-top:16px">${a.length?a.map(card).join(''):'<div class="empty">No hay recordatorios pendientes.</div>'}</div></div>`}
function settingsPage(){$('view').innerHTML=`<div class="page"><h1>Más opciones</h1><div class="card setting"><h3>💾 Exportar respaldo</h3><p>Guarda todos los clientes y fechas para recuperarlos en otro celular.</p><button class="secondary" onclick="exportBackup()">Exportar respaldo</button></div><div class="card setting"><h3>↥ Restaurar respaldo</h3><p>Importa un respaldo anterior y recupera la base de datos.</p><button class="secondary" onclick="Android?.importBackup?.()">Seleccionar archivo</button></div><div class="card setting"><h3>🔔 Notificaciones</h3><p>Se programan para las 9:00 a. m. del día de renovación y se recuperan después de reiniciar el teléfono.</p></div><div class="card setting"><h3>🛡 Datos privados</h3><p>La base principal se guarda en este teléfono. Conviene exportar un respaldo periódicamente.</p></div></div>`}
function form(id){editId=id||null;let c=id?clients.find(x=>x.id===id):null,d=c?.serviceDate||new Date().toISOString().slice(0,10);$('view').innerHTML=`<div class="page"><div class="title"><button class="back" onclick="go('clients')">←</button><h1>${c?'Editar':'Nuevo'} cliente</h1><span></span></div><div class="fg"><label>Nombre completo *</label><input id="name" class="input" value="${esc(c?.name||'')}" placeholder="Ej. Juan Pérez"></div><div class="fg"><label>Teléfono *</label><input id="phone" class="input" value="${esc(c?.phone||'')}" placeholder="Ej. 6000-1234"></div><div class="fg"><label>Placa *</label><input id="plate" class="input" value="${esc(c?.plate||'')}" placeholder="Ej. ABC123"></div><div class="fg"><label>Fecha del acabado cerámico *</label><input id="date" type="date" class="input" value="${d}" onchange="$('renew').textContent=fmt(addDate(this.value))"></div><div class="renew"><small>Próximo recordatorio</small><strong id="renew">${fmt(addDate(d))}</strong><small>2 meses y 15 días después</small></div><button class="fab" onclick="saveClient()">▣ GUARDAR CLIENTE</button></div>`}
function saveClient(){let name=$('name').value.trim(),phone=$('phone').value.trim(),plate=$('plate').value.trim().toUpperCase(),serviceDate=$('date').value;if(!name||!phone||!plate||!serviceDate)return toast('Completa todos los campos');let renewalDate=addDate(serviceDate);
 if(editId){let c=clients.find(x=>x.id===editId);Android?.cancelReminder?.(c.id);Object.assign(c,{name,phone,plate,serviceDate,renewalDate,completed:false});Android?.scheduleReminder?.(c.id,name,plate,renewalDate)}else{let c={id:String(Date.now()),name,phone,plate,serviceDate,renewalDate,completed:false,createdAt:Date.now()};clients.push(c);Android?.scheduleReminder?.(c.id,name,plate,renewalDate)}save();toast('Cliente guardado');go('clients')}
function detail(id){let c=clients.find(x=>x.id===id),[t,col]=due(c);page='detail';$('view').innerHTML=`<div class="page"><div class="title"><button class="back" onclick="go('clients')">←</button><h1>Detalle</h1><button class="back" onclick="form('${id}')">✎</button></div><div class="card setting" style="text-align:center"><div class="avatar" style="margin:auto;width:70px;height:70px;font-size:22px">${esc(initials(c.name))}</div><h2>${esc(c.name)}</h2><div class="plate">${esc(c.plate)}</div><div class="meta">${esc(c.phone)}</div></div><div class="card setting"><h3>Fecha del tratamiento</h3><p>${fmt(c.serviceDate)}</p></div><div class="renew"><small>Próximo recordatorio</small><strong>${fmt(c.renewalDate)}</strong><small class="${col}">${esc(t)}</small></div><button class="fab" onclick="wa('${id}')">WhatsApp · contactar cliente</button><div class="actions">${!c.completed?`<button class="success" onclick="complete('${id}')">✓ Marcar recordado</button>`:''}<button class="danger" onclick="removeClient('${id}')">Eliminar</button></div></div>`}
function complete(id){let c=clients.find(x=>x.id===id);c.completed=true;Android?.cancelReminder?.(id);save();toast('Marcado como recordado');go('reminders')}
function removeClient(id){if(!confirm('¿Eliminar este cliente?'))return;Android?.cancelReminder?.(id);clients=clients.filter(x=>x.id!==id);save();go('clients')}
function wa(id){let c=clients.find(x=>x.id===id),m=`Hola ${c.name}, le saludamos de Carwash Miami. Le recordamos que corresponde revisar/renovar el acabado cerámico de su vehículo ${c.plate}. ¿Desea coordinar una cita?`;Android?.openWhatsApp?.(c.phone,m)}
function exportBackup(){let p=JSON.stringify({app:'Carwash Miami Cerámico',version:1,exportedAt:new Date().toISOString(),clients},null,2);Android?.exportBackup?.(p)}
window.importBackupFromAndroid=function(raw){try{let o=JSON.parse(raw),a=Array.isArray(o)?o:o.clients;if(!Array.isArray(a))throw 0;let combine=clients.length&&confirm('Aceptar = combinar con datos actuales. Cancelar = reemplazar todo.');if(combine){let m=new Map(clients.map(c=>[c.id,c]));a.forEach(c=>m.set(c.id,c));clients=[...m.values()]}else clients=a;save();clients.filter(c=>!c.completed).forEach(c=>Android?.scheduleReminder?.(c.id,c.name,c.plate,c.renewalDate));toast('Respaldo restaurado');go('home')}catch(e){toast('Archivo de respaldo no válido')}}
function render(){({home,clients:clientsPage,reminders:remindersPage,settings:settingsPage}[page]||home)()}save();go('home')
</script></body></html>
