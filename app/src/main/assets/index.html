<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020910"><title>Carwash Miami</title>
<style>
:root{--bg:#020910;--panel:#071722;--line:#17384d;--txt:#f4fbff;--muted:#8299aa;--blue:#13bfff;--purple:#bd79ff;--green:#35e493;--bottom:env(safe-area-inset-bottom);--top:env(safe-area-inset-top)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020910;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}.app{min-height:100vh;padding-bottom:calc(84px + var(--bottom));background:radial-gradient(circle at 50% -10%,#0b456b55,transparent 36%)}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:30px 20px}.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#071722,#041018)}.loginBox{width:min(100%,420px);padding:25px}.brand{text-align:center;font-size:32px;font-weight:1000}.brand span{color:var(--blue)}.sub{text-align:center;color:var(--muted);margin:4px 0 22px}.label{display:block;margin:11px 0 5px;color:#a9c1d0;font-size:12px;font-weight:800}.input{width:100%;padding:13px;border:1px solid #21475e;border-radius:11px;background:#04111a;color:#fff;outline:none}.primary,.secondary,.danger{width:100%;padding:13px;border-radius:11px;font-weight:900;margin-top:11px}.primary{border:0;background:linear-gradient(#1cc7ff,#0785d1);color:#fff}.secondary{border:1px solid #285169;background:#06141e;color:#d9eaf4}.danger{border:1px solid #6b2a32;background:#19080b;color:#ff7b84}.err{text-align:center;color:#ff7b84;margin-top:10px;font-size:12px}.top{padding:calc(var(--top) + 14px) 16px 10px}.logo{font-size:28px;font-weight:1000}.logo span{color:var(--blue)}.page{padding:8px 14px 24px}.homeCards{display:grid;gap:12px;margin-top:14px}.homeCard{padding:17px;display:grid;grid-template-columns:50px 1fr 22px;gap:12px;align-items:center}.ico{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;font-size:24px}.homeCard b{font-size:14px}.homeCard small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}.clientsCard{border-color:#165879}.clientsCard .ico{background:#073552;color:var(--blue)}.cerCard{border-color:#5a3472}.cerCard .ico{background:#321b48;color:var(--purple)}.dailyCard{border-color:#17633f}.dailyCard .ico{background:#073b29;color:var(--green)}.titlebar{min-height:64px;padding:calc(var(--top) + 9px) 10px 9px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;position:sticky;top:0;z-index:20;background:#020a10f5;border-bottom:1px solid #123146}.titlebar h2{margin:0;text-align:center;font-size:18px}.back,.headBtn{width:44px;height:44px;border:0;background:transparent;color:#eaf8ff;font-size:29px;display:grid;place-items:center}.headBtn{color:var(--blue);font-size:24px}.search input{width:100%;padding:13px;border-radius:11px;border:1px solid #21475e;background:#06131d;color:#fff;margin:6px 0 12px}.list{display:grid;gap:9px}.person{padding:12px;display:grid;grid-template-columns:46px 1fr 42px;gap:10px;align-items:center}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid #168dc4;background:#06263b;color:#40ceff;font-weight:1000}.meta{font-size:11px;color:var(--muted);margin-top:3px}.wa{width:40px;height:40px;border-radius:50%;border:1px solid #14844f;background:#062318;color:#35e98a;font-size:20px}.fab{position:fixed;right:18px;bottom:calc(92px + var(--bottom));width:55px;height:55px;border:0;border-radius:50%;background:#0aaef3;color:#fff;font-size:30px;z-index:25}.form{padding:15px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.section{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 8px}.vehicle,.ceramic,.record{padding:12px;margin-top:8px}.vehicle{display:grid;grid-template-columns:43px 1fr 35px;gap:10px;align-items:center}.car{width:43px;height:43px;border-radius:11px;background:#102431;display:grid;place-items:center}.plate{color:#42caff;font-size:11px;font-weight:900}.dots{border:0;background:transparent;color:#bfd1dc;font-size:23px}.detail{padding:14px;display:flex;gap:12px;align-items:center}.detail .avatar{width:62px;height:62px}.big{font-size:20px;font-weight:1000}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0}.actions button{padding:11px;border-radius:10px;border:1px solid #254c64;background:#06141e;color:#dbeaf3;font-weight:850}.actions .green{color:#42eb96;border-color:#147b4b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{text-align:center;padding:12px 4px}.stat b{display:block;font-size:20px;color:var(--blue)}.stat:nth-child(2) b{color:var(--green)}.stat:nth-child(3) b{color:var(--purple)}.stat small{font-size:9px;color:var(--muted)}.ceramicTop,.recordTop{display:flex;justify-content:space-between;gap:8px}.due{font-size:11px;font-weight:900;margin-top:6px}.red{color:#ff6370}.amber{color:#ffb62f}.greenT{color:var(--green)}.amount{font-size:17px;color:#40d4ff;font-weight:1000}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{font-size:9px;padding:4px 7px;border:1px solid #28536c;border-radius:999px;color:#b7cedb}.serviceGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.service{position:relative}.service input{position:absolute;opacity:0}.service span{display:block;padding:10px;border:1px solid #23475e;border-radius:9px;text-align:center;font-size:10px;color:#c9dce8}.service input:checked+span{background:#0a689f;border-color:#22c3ff;color:#fff}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 3px calc(10px + var(--bottom));background:#03111bf7;border-top:1px solid #17384d;z-index:30}.nav button{border:0;background:transparent;color:#7e93a2;min-height:58px;font-size:9px;font-weight:800}.ni{display:block;font-size:21px;margin-bottom:4px}.active.home{color:#20bfff}.active.clients{color:#28c6ff}.active.cer{color:#c17cff}.active.daily{color:#35e695}.active.more{color:#ffb64a}.toast{position:fixed;left:50%;bottom:calc(95px + var(--bottom));transform:translateX(-50%);background:#07304a;border:1px solid #1b6c98;padding:10px 14px;border-radius:9px;z-index:99;font-size:12px}
</style></head><body><div id="app"></div><div id="toast" class="toast hidden"></div><script>
const KEY='cm_ceramico_clients_v1',DKEY='cm_daily_records_v1';
let old=JSON.parse(localStorage.getItem(KEY)||'[]');
let clients=old.map(c=>c.vehicles?c:{id:c.id||'c'+Date.now()+Math.random(),name:c.name||'',phone:c.phone||'',notes:c.notes||'',vehicles:c.plate?[{id:'v'+(c.id||Date.now()),brand:'',model:'',plate:c.plate,color:'',ceramic:{serviceDate:c.serviceDate||'',renewalDate:c.renewalDate||'',periodMonths:c.periodMonths??2,periodDays:c.periodDays??15,notes:c.notes||''}}]:[]});
let daily=JSON.parse(localStorage.getItem(DKEY)||'[]'),page='login',sel=null,editC=null,editV=null;
const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(clients));localStorage.setItem(DKEY,JSON.stringify(daily));window.Android?.syncData?.(JSON.stringify(clients))}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1600)}
function today(){return new Date().toISOString().slice(0,10)} function fmt(i){if(!i)return'—';let[y,m,d]=i.split('-');return`${d}/${m}/${y}`} function money(n){return'₡'+Number(n||0).toLocaleString('es-CR')}
function calc(i,m,d){if(!i)return'';let[y,mo,da]=i.split('-').map(Number),x=new Date(y,mo-1,da),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+m);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'CM'}
function nav(a){return`<nav class="nav"><button class="home ${a==='home'?'active':''}" onclick="go('home')"><span class="ni">⌂</span>Inicio</button><button class="clients ${a==='clients'?'active':''}" onclick="go('clients')"><span class="ni">♙</span>Clientes</button><button class="cer ${a==='ceramic'?'active':''}" onclick="go('ceramic')"><span class="ni">♢</span>Cerámicos</button><button class="daily ${a==='daily'?'active':''}" onclick="go('daily')"><span class="ni">▣</span>Diario</button><button class="more ${a==='more'?'active':''}" onclick="go('more')"><span class="ni">•••</span>Más</button></nav>`}
function bar(t,b='home',r=''){return`<div class="titlebar"><button class="back" onclick="go('${b}')">‹</button><h2>${t}</h2><div>${r}</div></div>`}
function go(p){page=p;sel=null;editC=null;editV=null;render();scrollTo(0,0)}
function render(){({login,home,clients:clientsPage,client:clientPage,clientForm,vehicleForm,ceramic:ceramicPage,daily:dailyPage,dailyForm,more:morePage}[page]||home)()}
function login(){$('#app').innerHTML=`<div class="login"><div class="card loginBox"><div class="brand">CARWASH<span>MIAMI</span></div><div class="sub">Acceso privado · Gestión premium</div><label class="label">Usuario</label><input id="u" class="input"><label class="label">Contraseña</label><input id="p" type="password" class="input"><button class="primary" onclick="doLogin()">INGRESAR</button><div id="e" class="err"></div></div></div>`}
function doLogin(){if($('#u').value.trim()==='admin'&&$('#p').value==='admin'){page='home';render()}else $('#e').textContent='Usuario o contraseña incorrectos'}
function home(){let cer=clients.reduce((s,c)=>s+c.vehicles.filter(v=>v.ceramic?.renewalDate).length,0),dr=daily.filter(r=>r.date===today());$('#app').innerHTML=`<div class="app"><div class="top"><div class="logo">CARWASH<span>MIAMI</span></div></div><div class="page"><div class="stats"><div class="card stat"><b>${clients.length}</b><small>Clientes</small></div><div class="card stat"><b>${cer}</b><small>Cerámicos</small></div><div class="card stat"><b>${dr.length}</b><small>Hoy</small></div></div><div class="homeCards"><div class="card homeCard clientsCard" onclick="go('clients')"><div class="ico">♙</div><div><b>CLIENTES</b><small>Clientes, teléfonos y varios vehículos.</small></div><div>›</div></div><div class="card homeCard cerCard" onclick="go('ceramic')"><div class="ico">♢</div><div><b>ACABADOS CERÁMICOS</b><small>Control y recordatorios de tratamientos.</small></div><div>›</div></div><div class="card homeCard dailyCard" onclick="go('daily')"><div class="ico">▣</div><div><b>CONTROL DIARIO</b><small>Vehículos que ingresan al lavacar.</small></div><div>›</div></div></div></div>${nav('home')}</div>`}
function personHtml(c){return`<div class="card person" onclick="openClient('${c.id}')"><div class="avatar">${initials(c.name)}</div><div><b>${esc(c.name)}</b><div class="meta">${esc(c.phone||'Sin teléfono')} · ${c.vehicles.length} vehículo${c.vehicles.length===1?'':'s'}</div></div><button class="wa" onclick="event.stopPropagation();wa('${c.phone}')">◉</button></div>`}
function clientsPage(){$('#app').innerHTML=`<div class="app">${bar('Clientes')}<div class="page"><div class="search"><input id="q" placeholder="Buscar nombre, placa o teléfono..." oninput="filterClients()"></div><div id="rows" class="list">${clients.map(personHtml).join('')||'<div class="card" style="padding:20px;text-align:center;color:#8299aa">No hay clientes registrados.</div>'}</div></div><button class="fab" onclick="newClient()">＋</button>${nav('clients')}</div>`}
function filterClients(){let q=$('#q').value.toLowerCase();$('#rows').innerHTML=clients.filter(c=>[c.name,c.phone,...c.vehicles.map(v=>v.plate)].join(' ').toLowerCase().includes(q)).map(personHtml).join('')||'<div class="card" style="padding:20px;text-align:center;color:#8299aa">Sin resultados.</div>'}
function openClient(id){sel=id;page='client';render()} function newClient(){editC=null;page='clientForm';render()}
function clientPage(){let c=clients.find(x=>x.id===sel);if(!c)return go('clients');let vs=c.vehicles.map(v=>`<div class="card vehicle"><div class="car">▰</div><div><b>${esc([v.brand,v.model].filter(Boolean).join(' ')||'Vehículo')}</b><div class="plate">${esc(v.plate)}</div><div class="meta">${esc(v.color||'')}</div></div><button class="dots" onclick="editVeh('${v.id}')">⋮</button></div>`).join('');$('#app').innerHTML=`<div class="app">${bar('Detalle del cliente','clients','<button class="headBtn" onclick="editClientNow()">✎</button>')}<div class="page"><div class="card detail"><div class="avatar">${initials(c.name)}</div><div><div class="big">${esc(c.name)}</div><div class="meta">${esc(c.phone||'Sin teléfono')}</div></div></div><div class="actions"><button class="green" onclick="wa('${c.phone}')">WhatsApp</button><button onclick="editClientNow()">Editar</button></div><div class="section"><b>Vehículos</b><span class="meta">${c.vehicles.length}</span></div>${vs||'<div class="card" style="padding:15px;color:#8299aa">Sin vehículos.</div>'}<button class="primary" onclick="newVeh()">＋ AGREGAR VEHÍCULO</button><button class="danger" onclick="deleteClient('${c.id}')">ELIMINAR CLIENTE</button></div>${nav('clients')}</div>`}
function editClientNow(){editC=sel;page='clientForm';render()}
function clientForm(){let c=editC?clients.find(x=>x.id===editC):null;$('#app').innerHTML=`<div class="app">${bar(c?'Editar cliente':'Agregar cliente',c?'client':'clients','<button class="headBtn" onclick="saveClient()">✓</button>')}<div class="page"><div class="card form"><label class="label">Nombre completo</label><input id="fn" class="input" value="${esc(c?.name||'')}"><label class="label">Teléfono / WhatsApp</label><input id="fp" class="input" value="${esc(c?.phone||'')}"><label class="label">Notas</label><textarea id="notes" class="input" rows="3">${esc(c?.notes||'')}</textarea><button class="primary" onclick="saveClient()">GUARDAR CLIENTE</button></div></div>${nav('clients')}</div>`}
function saveClient(){let name=$('#fn').value.trim(),phone=$('#fp').value.trim(),notes=$('#notes').value.trim();if(!name)return toast('Escribe el nombre');if(editC){let c=clients.find(x=>x.id===editC);Object.assign(c,{name,phone,notes});sel=c.id}else{let c={id:'c'+Date.now(),name,phone,notes,vehicles:[]};clients.push(c);sel=c.id}save();page='client';render()}
function newVeh(){editV=null;page='vehicleForm';render()} function editVeh(id){editV=id;page='vehicleForm';render()}
function vehicleForm(){let c=clients.find(x=>x.id===sel),v=editV?c.vehicles.find(x=>x.id===editV):null,ce=v?.ceramic||{};$('#app').innerHTML=`<div class="app">${bar(v?'Editar vehículo':'Agregar vehículo','client','<button class="headBtn" onclick="saveVehicle()">✓</button>')}<div class="page"><div class="card form"><div class="row2"><div><label class="label">Marca</label><input id="vb" class="input" value="${esc(v?.brand||'')}"></div><div><label class="label">Modelo</label><input id="vm" class="input" value="${esc(v?.model||'')}"></div></div><label class="label">Placa</label><input id="vp" class="input" value="${esc(v?.plate||'')}"><label class="label">Color</label><input id="vc" class="input" value="${esc(v?.color||'')}"><div class="section"><b>Acabado cerámico</b><span class="meta">Opcional</span></div><label class="label">Fecha del servicio</label><input id="sd" type="date" class="input" value="${esc(ce.serviceDate||'')}"><div class="row2"><div><label class="label">Meses</label><input id="pm" type="number" min="0" class="input" value="${ce.periodMonths??2}"></div><div><label class="label">Días</label><input id="pd" type="number" min="0" class="input" value="${ce.periodDays??15}"></div></div><label class="label">Notas</label><textarea id="vn" class="input" rows="3">${esc(ce.notes||'')}</textarea><button class="primary" onclick="saveVehicle()">GUARDAR VEHÍCULO</button>${v?'<button class="danger" onclick="deleteVehicle()">ELIMINAR VEHÍCULO</button>':''}</div></div>${nav('clients')}</div>`}
function saveVehicle(){let c=clients.find(x=>x.id===sel),brand=$('#vb').value.trim(),model=$('#vm').value.trim(),plate=$('#vp').value.trim().toUpperCase(),color=$('#vc').value.trim(),sd=$('#sd').value,pm=Number($('#pm').value||0),pd=Number($('#pd').value||0),notes=$('#vn').value.trim();if(!plate)return toast('Escribe la placa');let ceramic=sd?{serviceDate:sd,periodMonths:pm,periodDays:pd,renewalDate:calc(sd,pm,pd),notes}:{};if(editV)Object.assign(c.vehicles.find(x=>x.id===editV),{brand,model,plate,color,ceramic});else c.vehicles.push({id:'v'+Date.now(),brand,model,plate,color,ceramic});save();page='client';render()}
function deleteVehicle(){if(!confirm('¿Eliminar vehículo?'))return;let c=clients.find(x=>x.id===sel);c.vehicles=c.vehicles.filter(v=>v.id!==editV);save();page='client';render()} function deleteClient(id){if(!confirm('¿Eliminar cliente y vehículos?'))return;clients=clients.filter(c=>c.id!==id);save();go('clients')}
function ceramicPage(){let a=[];clients.forEach(c=>c.vehicles.forEach(v=>{if(v.ceramic?.renewalDate)a.push({c,v})}));a.sort((x,y)=>x.v.ceramic.renewalDate.localeCompare(y.v.ceramic.renewalDate));let h=a.map(({c,v})=>{let n=Math.ceil((new Date(v.ceramic.renewalDate)-new Date(today()))/86400000),cl=n<0?'red':n<=30?'amber':'greenT';return`<div class="card ceramic"><div class="ceramicTop"><div><b>${esc(c.name)}</b><div class="meta">${esc([v.brand,v.model].filter(Boolean).join(' '))} · ${esc(v.plate)}</div></div><button class="wa" onclick="wa('${c.phone}')">◉</button></div><div class="due ${cl}">${n<0?'Vencido hace '+Math.abs(n)+' días':'Vence en '+n+' días'} · ${fmt(v.ceramic.renewalDate)}</div></div>`}).join('');$('#app').innerHTML=`<div class="app">${bar('Acabados cerámicos')}<div class="page">${h||'<div class="card" style="padding:20px;text-align:center;color:#8299aa">No hay acabados cerámicos registrados.</div>'}</div>${nav('ceramic')}</div>`}
function dailyPage(){let a=daily.filter(r=>r.date===today()),sum=a.reduce((s,r)=>s+Number(r.amount||0),0),h=a.map(r=>`<div class="card record"><div class="recordTop"><div><b>${esc(r.name)}</b><div class="plate">${esc(r.plate)}</div><div class="meta">${esc(r.brand||'')} · ${esc(r.phone||'')}</div></div><div class="amount">${money(r.amount)}</div></div><div class="chips">${(r.services||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div></div>`).join('');$('#app').innerHTML=`<div class="app">${bar('Control diario')}<div class="page"><div class="stats"><div class="card stat"><b>${a.length}</b><small>Vehículos</small></div><div class="card stat"><b>${money(sum)}</b><small>Ingresos</small></div><div class="card stat"><b>${a.reduce((s,r)=>s+(r.services?.length||0),0)}</b><small>Servicios</small></div></div>${h||'<div class="card" style="padding:20px;text-align:center;color:#8299aa">Sin registros hoy.</div>'}</div><button class="fab" onclick="page='dailyForm';render()">＋</button>${nav('daily')}</div>`}
function dailyForm(){let ss=['Premium','Plus','Lavado de chasis','Lavado de motor','Acabado cerámico','Otro'];$('#app').innerHTML=`<div class="app">${bar('Nuevo ingreso','daily','<button class="headBtn" onclick="saveDaily()">✓</button>')}<div class="page"><div class="card form"><label class="label">Nombre</label><input id="dn" class="input"><div class="row2"><div><label class="label">Placa</label><input id="dp" class="input"></div><div><label class="label">Marca</label><input id="db" class="input"></div></div><label class="label">Teléfono</label><input id="dph" class="input"><label class="label">Monto (₡)</label><input id="da" type="number" class="input"><label class="label">Servicios</label><div class="serviceGrid">${ss.map(s=>`<label class="service"><input type="checkbox" value="${s}"><span>${s}</span></label>`).join('')}</div><button class="primary" onclick="saveDaily()">GUARDAR INGRESO</button></div></div>${nav('daily')}</div>`}
function saveDaily(){let n=$('#dn').value.trim(),p=$('#dp').value.trim().toUpperCase();if(!n||!p)return toast('Completa nombre y placa');daily.push({id:'d'+Date.now(),date:today(),name:n,plate:p,brand:$('#db').value.trim(),phone:$('#dph').value.trim(),amount:Number($('#da').value||0),services:[...document.querySelectorAll('.service input:checked')].map(x=>x.value)});save();go('daily')}
function morePage(){$('#app').innerHTML=`<div class="app">${bar('Más')}<div class="page"><div class="card form"><b>Respaldo de datos</b><div class="meta">Conserva clientes y control diario.</div><button class="secondary" onclick="backup()">EXPORTAR RESPALDO</button></div><div class="card form" style="margin-top:9px"><b>Versión</b><div class="meta">Carwash Miami 3.1</div></div><button class="danger" onclick="page='login';render()">CERRAR SESIÓN</button></div>${nav('more')}</div>`}
function backup(){let d=JSON.stringify({clients,daily},null,2);if(window.Android?.exportData)window.Android.exportData(d);else{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));a.download='carwash-miami-respaldo.json';a.click()}}
function wa(phone){let n=String(phone||'').replace(/\D/g,'');if(!n)return toast('Cliente sin teléfono');if(n.length===8)n='506'+n;location.href='https://wa.me/'+n}
render();</script></body></html>
