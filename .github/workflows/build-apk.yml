name: Generar APK Carwash Miami

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar llave de firma
        env:
          CM_KEYSTORE_BASE64: ${{ secrets.CM_KEYSTORE_BASE64 }}
        run: echo "$CM_KEYSTORE_BASE64" | base64 --decode > app/carwash-miami-release.jks

      - name: Compilar APK firmada
        env:
          CM_STORE_FILE: carwash-miami-release.jks
          CM_STORE_PASSWORD: ${{ secrets.CM_STORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Carwash-Miami-Ceramico-APK
          path: app/build/outputs/apk/release/app-release.apk
